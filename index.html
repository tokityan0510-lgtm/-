<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>連鎖破壊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e3e8ef; --surface:#f6f8fb; --ink:#1a2130; --muted:#5a6577; --line:#c4cdd9;
  --accent:#e0215f; --accent-deep:#a3123f; --coin:#a86f00; --coin-bg:#f6b400;
  --scrim:rgba(227,232,239,.9); --on-accent:#ffffff; --good:#0f8a5f; --dust:#6a43c4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161f; --surface:#1a2330; --ink:#edf1f6; --muted:#93a0b3; --line:#2b3645;
    --accent:#ff4c88; --accent-deep:#b21b50; --coin:#ffc53a; --coin-bg:#ffc53a;
    --scrim:rgba(16,22,31,.92); --on-accent:#ffffff; --good:#3ddc97; --dust:#b48cff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161f; --surface:#1a2330; --ink:#edf1f6; --muted:#93a0b3; --line:#2b3645;
  --accent:#ff4c88; --accent-deep:#b21b50; --coin:#ffc53a; --coin-bg:#ffc53a;
  --scrim:rgba(16,22,31,.92); --on-accent:#ffffff; --good:#3ddc97; --dust:#b48cff;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-weight:500;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
.display{font-family:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-weight:400}
button{font:inherit;color:inherit}

/* HUD */
.hud{padding:6px 14px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.purse{flex:1;min-width:0;line-height:1}
.coins{display:flex;align-items:baseline;gap:6px}
#coins{font-size:clamp(28px,8.6vw,44px);color:var(--coin);white-space:nowrap;font-variant-numeric:tabular-nums}
#coins.long{font-size:clamp(18px,5.4vw,28px)}
#coins.long + small{display:none}
.ex sup{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-weight:900;font-size:.5em;vertical-align:.9em;margin-left:1px}
.ex{white-space:nowrap}
.coins small{font-size:12px;color:var(--muted);font-weight:700}
#prod{display:block;margin-top:4px;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
#prod b{color:var(--good)}
#prod .mul{color:var(--accent);margin-left:6px}
.hud-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
#stageName{font-size:13px;padding:4px 10px;border-radius:8px;background:var(--surface);border:1.5px solid var(--line);white-space:nowrap;max-width:36vw;overflow:hidden;text-overflow:ellipsis}
#stageSwatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
#dustTag{font-size:12px;font-weight:700;color:var(--dust);white-space:nowrap}
#dustTag[hidden]{display:none}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0}
.news{padding:0 14px 4px;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.news b{color:var(--accent)}

/* Arena */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#0b0f15}
#cv{display:block;touch-action:none;cursor:crosshair}
.chain{position:absolute;left:0;right:0;top:8px;text-align:center;pointer-events:none;opacity:0;line-height:1;color:#fff}
#chainNum{font-size:clamp(30px,9vw,52px);display:inline-block;transform-origin:50% 60%;
  text-shadow:0 0 18px currentColor,0 3px 0 #000,0 -2px 0 #000,3px 0 0 #000,-3px 0 0 #000}
#chainLabel{font-size:18px;margin-left:4px;text-shadow:0 2px 0 #000,0 0 10px currentColor}
#chainMult{display:block;margin-top:4px;font-size:15px;font-weight:700;color:#ffd84d;text-shadow:0 2px 0 #000}
#chainTier{display:block;margin-top:2px;font-size:14px;text-shadow:0 2px 0 #000,0 0 8px currentColor}
#fever{position:absolute;left:0;right:0;top:16%;text-align:center;pointer-events:none;opacity:0;transform:translateY(-50%)}
#fever span{font-size:clamp(40px,13vw,76px);color:#fff;display:inline-block;
  text-shadow:0 0 20px #ff4c88,0 0 40px #ffd84d,0 4px 0 #000;animation:pulse .5s ease-in-out infinite alternate}
#fever small{display:block;font-size:14px;color:#fff;font-weight:700;margin-top:6px;text-shadow:0 2px 0 #000}
body.loud #chainNum{font-size:clamp(44px,14vw,80px)}
#fever span{font-size:clamp(30px,10vw,56px)}
body.loud #fever span{font-size:clamp(40px,13vw,76px)}
body.loud #fever{top:44%}
body:not(.loud) #fever span{animation:none}
@keyframes pulse{from{transform:scale(1) rotate(-3deg);filter:hue-rotate(0)}to{transform:scale(1.08) rotate(3deg);filter:hue-rotate(160deg)}}
#buffs{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.buff{font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border-radius:8px;padding:4px 8px;border-left:4px solid var(--c,#ffd84d);text-shadow:0 1px 0 #000}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-140%);background:rgba(0,0,0,.8);color:#fff;border-radius:12px;padding:8px 14px;
  font-size:13px;font-weight:700;border:2px solid #ffd84d;max-width:88%;text-align:center;transition:transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;z-index:3}
.toast.show{transform:translate(-50%,0)}
.toast b{color:#ffd84d;display:block;font-size:11px;margin-bottom:2px}

/* Bottom bar */
.bar{padding:6px 14px 10px}
.gauge{height:5px;border-radius:3px;background:var(--surface);overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}
#feverFill{height:100%;width:0;background:linear-gradient(90deg,#ff4c88,#ffd84d,#3ddc97,#4cc9ff,#b48cff)}
.row{display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
#progText{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#progNum{white-space:nowrap;flex-shrink:0}
.prog-label span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
.prog-bar{height:12px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line);overflow:hidden}
#progFill{height:100%;width:0;background:var(--accent);transition:width .2s}
#progFill.boss{background:linear-gradient(90deg,#ff4c88,#ff8a1f)}
.shop-btn{position:relative;appearance:none;border:0;cursor:pointer;border-radius:999px;padding:12px 22px;font-size:17px;
  background:var(--ink);color:var(--bg);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.shop-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.shop-btn .dot{position:absolute;top:6px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.shop-btn .dot[hidden]{display:none}

/* Overlay */
.overlay{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;color:var(--ink);z-index:4}
.overlay[hidden]{display:none}
.panel{width:100%;max-width:540px;margin:0 auto;padding:16px 16px 8px;flex:1}
.center{display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:100%}
.big-title{margin:0;font-size:clamp(72px,24vw,132px);line-height:.92;letter-spacing:-.02em;color:var(--accent)}
.big-title span{display:block;color:var(--ink);transform:translateX(.5em)}
.center p{margin:0;max-width:32em;line-height:1.75;font-size:15px}
.center h1.display{margin:0;font-size:clamp(44px,14vw,80px);line-height:1.05;color:var(--accent)}
.welcome-num{font-size:clamp(36px,11vw,60px);color:var(--coin);line-height:1.1}
.dust-num{font-size:clamp(36px,11vw,60px);color:var(--dust);line-height:1.1}

.go,.buy{appearance:none;border:0;cursor:pointer;width:100%;border-radius:999px;
  font-family:"Dela Gothic One",system-ui,sans-serif;font-size:20px;padding:15px 20px;
  background:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s}
.go:active,.buy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.go.ghost{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.buy{font-size:15px;padding:10px 16px}
.buy:disabled{background:var(--surface);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default}
.small{appearance:none;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:18px 0 4px;cursor:pointer}
.small.armed{color:var(--accent);font-weight:700}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;height:74%;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.25);color:var(--ink);z-index:2}
.sheet[hidden]{display:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer;position:relative;white-space:nowrap;flex-shrink:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 24px;touch-action:pan-y}
.close{flex-shrink:0}
.hint{font-size:12px;color:var(--muted);margin:10px 0 6px;line-height:1.6}
.modes{display:flex;gap:4px;margin:6px 0 2px}
.mode{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.mode.on{background:var(--accent);border-color:var(--accent);color:#fff}

.list{list-style:none;margin:6px 0 0;padding:0;border-top:1.5px solid var(--line)}
.list li{border-bottom:1.5px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:11px 2px;align-items:center}
.item.btn{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:11px 2px;align-items:center;cursor:pointer}
.name{font-weight:700;font-size:15px}
.name .lv{font-size:12px;color:var(--muted);margin-left:6px}
.val{font-size:13px;font-weight:700;color:var(--accent)}
.note{grid-column:1 / -1;font-size:12px;color:var(--muted);line-height:1.5}
.cost{grid-column:2;grid-row:1 / span 2;justify-self:end;font-family:"Dela Gothic One",system-ui,sans-serif;font-size:14px;
  padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap;background:none;cursor:pointer}
.cost small{font-family:inherit;font-size:10px;display:block;text-align:center;line-height:1}
.can .cost,.cost.can{background:var(--coin-bg);border-color:var(--coin-bg);color:#1a1200}
.cost.dust{border-color:var(--dust);color:var(--dust)}
.can .cost.dust,.cost.dust.can{background:var(--dust);border-color:var(--dust);color:#fff}
.item.btn[aria-disabled="true"]{cursor:default}
.item.btn[aria-disabled="true"] .name,.item.btn[aria-disabled="true"] .val{opacity:.6}
.acts{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.eq{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.eq.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.eq:disabled{opacity:.45;cursor:default}
.locked .name{color:var(--muted)}
.done .name{color:var(--good)}
.section-title{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 2px}
.toggle{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--muted)}
.toggle.on{background:var(--good);border-color:var(--good);color:#fff}
.toggle:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.arm-toggles{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.arm-toggles .toggle{font-size:12px;padding:6px 10px}
.dps-total{font-size:12px;color:var(--muted);font-weight:700;margin:6px 0}
.dps-total b{color:var(--ink);font-variant-numeric:tabular-nums}
.dps-row{display:grid;grid-template-columns:7.5em 1fr 3em;align-items:center;gap:8px;font-size:12px;font-weight:700;margin:3px 0}
.dps-bar{height:10px;border-radius:5px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.dps-bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.dps-pc{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:8px 0;font-size:13px}
.stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.stats b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:8px}
.ach div{border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:12px;line-height:1.4;background:var(--surface)}
.ach div.got{border-color:var(--coin-bg);background:color-mix(in srgb,var(--coin-bg) 15%,var(--surface))}
.ach b{display:block;font-size:13px}
.ach .d{color:var(--muted)}
.ach div:not(.got){opacity:.55}
.help{border:1.5px solid var(--line);border-radius:10px;margin-top:8px;background:var(--surface);font-size:13px;line-height:1.7}
.help summary{padding:10px 12px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:'＋';color:var(--muted)}
.help[open] summary::after{content:'−'}
.help>div{padding:0 12px 10px}
.help p{margin:6px 0}
.help ul{margin:6px 0;padding-left:18px}
.units{display:grid;grid-template-columns:repeat(3,max-content 1fr);gap:4px 8px;font-size:12px;margin-top:6px}
.units span{white-space:nowrap}
.io-row{display:flex;gap:8px;margin:6px 0}
.io-row .buy{flex:1;font-size:13px;padding:10px 8px}
.buy.ghost{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.io-box{width:100%;height:90px;font-size:11px;font-family:ui-monospace,monospace;border:1.5px solid var(--line);border-radius:8px;padding:6px;background:var(--surface);color:var(--ink);margin-top:6px}
.units b{font-weight:400;color:var(--muted)}
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:8px}
.relic{border:2px solid var(--rc);border-radius:10px;padding:8px;font-size:12px;line-height:1.4;background:color-mix(in srgb,var(--rc) 10%,var(--surface));display:flex;flex-direction:column;gap:2px}
.relic b{font-size:13px}
.relic .rr{color:var(--rc);font-weight:700;filter:brightness(.8)}
.relic.unk{border-style:dashed;opacity:.5;background:var(--surface)}
.relic .d{color:var(--muted)}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}
.combo{border:1.5px dashed var(--line);border-radius:10px;padding:8px;font-size:12px;line-height:1.4;display:flex;flex-direction:column;gap:2px;opacity:.6}
.combo.on{border:2px solid var(--accent);opacity:1;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.combo .rr{font-weight:700}
.combo .d{color:var(--muted)}
.prestige-box{margin:10px 0;padding:14px;border-radius:14px;border:2px solid var(--dust);text-align:center}
.prestige-box .dust-num{font-size:clamp(30px,9vw,48px)}
.prestige-box p{margin:6px 0;font-size:13px;line-height:1.6}
.go:focus-visible,.buy:focus-visible,.item.btn:focus-visible,.cost:focus-visible,.eq:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.small:focus-visible,.mode:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

@media (prefers-reduced-motion: reduce){#fever span{animation:none}.go,.buy{transition:none}}
</style>
</head>
<body>
<header class="hud">
  <div class="purse">
    <div class="coins"><span id="coins" class="display">0</span><small>コイン</small></div>
    <span id="prod"></span>
  </div>
  <div class="hud-side">
    <div style="display:flex;gap:6px;align-items:center">
      <span id="stageName"><span id="stageSwatch"></span><span id="stageText"></span></span>
      <button id="fxBtn" class="icon-btn" aria-label="演出：控えめ">🌙</button>
      <button id="mute" class="icon-btn" aria-label="音を消す">🔊</button>
    </div>
    <span id="dustTag" hidden></span>
  </div>
</header>
<div class="news" id="news"></div>
<main id="stage">
  <canvas id="cv" aria-label="ブロックのフィールド。タップで壊す"></canvas>
  <div class="chain" id="chain"><span id="chainNum" class="display">0</span><span id="chainLabel" class="display">コンボ</span><span id="chainTier" class="display"></span><span id="chainMult"></span></div>
  <div id="fever"><span class="display">フィーバー！</span><small>報酬2倍・威力2倍・連射2倍</small></div>
  <div id="buffs"></div>
  <div class="toast" id="toast"><b id="toastHead">実績解除</b><span id="toastText"></span></div>
  <div class="overlay" id="overlay" hidden></div>
  <section class="sheet" id="sheet" hidden aria-label="強化">
    <div class="sheet-head">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="icon-btn close" id="closeSheet" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</main>
<footer class="bar">
  <div class="gauge" title="フィーバーゲージ"><div id="feverFill"></div></div>
  <div class="row">
    <div class="prog" id="prog" role="button" tabindex="0" aria-label="ひびのゲージ。押すと詳しい数字を表示"><div class="prog-label"><span id="progText">砕くまで</span><span id="progNum"></span></div><div class="prog-bar"><div id="progFill"></div></div></div>
    <button class="shop-btn display" id="shopBtn">強化<span class="dot" id="shopDot" hidden></span></button>
  </div>
</footer>
<script>
(() => {

const UNITS = ['', '万', '億', '兆', '京', '垓', '秭', '穣', '溝', '澗', '正', '載', '極', '恒河沙', '阿僧祇', '那由他', '不可思議', '無量大数'];
const SUP = {0:'⁰', 1:'¹', 2:'²', 3:'³', 4:'⁴', 5:'⁵', 6:'⁶', 7:'⁷', 8:'⁸', 9:'⁹'};
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 10000) return Math.floor(n).toLocaleString('ja-JP');
  const k = Math.floor(Math.log10(n) / 4);
  // 無量大数の1万倍（10^72）より大きい数は「1.25×10¹⁵⁶」のように10の何乗かで表す（単位を重ねると読みにくい）
  if (k >= UNITS.length){ const e = Math.floor(Math.log10(n)), m = n / Math.pow(10, e); return `${m.toFixed(2)}×10${String(e).split('').map(c => SUP[c]).join('')}`; }
  const v = n / Math.pow(10, 4 * k);

// 出す遺物を選ぶ：まずレア度を重みで決め、そのレア度で最大Lvでないものから1つ。全部最大ならほかのレア度から
function dropRelic(minRar = 0){
  let x = Math.random() * 100, rar = 0;
  for (let k = RARITY.length - 1; k >= 0; k--){ x -= RARITY[k][2]; if (x < 0){ rar = k; break; } }
  rar = Math.max(rar, minRar);
  let pool = RELICS.filter(r => r.rar === rar && RL(r.id) < r.max);
  if (!pool.length) pool = RELICS.filter(r => r.rar < 4 && RL(r.id) < r.max);
  if (!pool.length) return null;
  const r = pool[Math.floor(Math.random() * pool.length)];
  save.relics[r.id] = RL(r.id) + 1; save.st.relics++;
  fx.relic(r, RL(r.id));
  return r;
}

function step(dt){
  if (state !== 'play') return;

  if (big.wob > 0) big.wob = Math.max(0, big.wob - dt * 4);
  if (big.spawn < 1) big.spawn = Math.min(1, big.spawn + dt * 1.6);
  // 炎上：燃えている間、少しずつダメージ
  if (big.burn > 0){
    big.burn -= dt; big.burnAcc += big.burnDps * dt * (fever > 0 ? 2 : 1);
    if (big.burnAcc > 0 && Math.random() < dt * 4){ const [x, y] = bigPoint(); hit(big.burnAcc, 'burn', x, y, big.bd); big.burnAcc = 0; }
  }
  stepMods(dt);
  // 共鳴：直前1秒に与えたダメージの一部を、もう一度与える
  resoT -= dt;
  if (resoT <= 0){ resoT = 1; const r = stat.reso(); if (r && resoWin > 0){ const [x, y] = bigPoint(); hit(resoWin * r, 'reso', x, y); } resoWin = 0; }
  // 幸運ブロック
  luckyT -= dt;

  if (lucky){
    lucky.ph += dt; lucky.x += lucky.vx * dt; lucky.y += Math.sin(lucky.ph * 1.3) * cell * .6 * dt; lucky.life -= dt;
    if (lucky.life <= 0 || lucky.x < -cell * 1.5 || lucky.x > W + cell * 1.5) lucky = null;
  }
  // 自動タップ（星屑）
  if (P('pauto')){
    autoT += dt;
    if (autoT >= 1 / P('pauto')){ autoT = 0; const [x, y] = bigPoint(); tap(x, y, true); }
  }
  // 全機斉射（特殊強化）：10秒ごとに0.25秒間、全部のドローンが撃ちまくる
  if (SP('dr5')){ volleyT -= dt; if (volleyT <= 0){ volleyT = 10; volley = .25; } }
  if (volley > 0) volley -= dt;
  // ドローン
  const nd = armOn('drone') ? stat.drones() : 0, di = stat.droneInt() * (fever > 0 ? .5 : 1);
  for (let k = 0; k < nd; k++){
    const dr = drones[k]; dr.ph += dt; dr.t -= dt;
    if (dr.t <= 0){ dr.t = di * (.8 + Math.random() * .4); fireDrone(dr); if (SP('rl2')) fireDrone(dr); }
    if (volley > 0 && Math.random() < dt * 20) fireDrone(dr);
  }
  stepArms(dt);
  for (let k = bullets.length - 1; k >= 0; k--){
    const u = bullets[k]; u.x += u.vx * dt; u.y += u.vy * dt; u.life -= dt;
    if (u.life <= 0){ bullets.splice(k, 1); hit(stat.dmg() * stat.droneDmg(), 'drone', u.tx, u.ty, 0, stat.drburst()); }
  }
  // かけら
  const dmg = stat.dmg(), hom = M('homing'), sp = M('split');
  const ricBonus = M('ricochet') ? .25 + .05 * (M('ricochet') - 1) : 0;
  const splitP = sp ? Math.min(.8, .2 + .07 * (sp - 1)) : 0;
  const pull = cell * (16 + 6 * hom);
  for (let s = shards.length - 1; s >= 0; s--){
    const o = shards[s]; let dead = false;
    const dx = BX - o.x, dy = BY - o.y, dd = Math.hypot(dx, dy) || 1;
    o.vx += dx / dd * pull * dt; o.vy += dy / dd * pull * dt;
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.x < 0 || o.x > W){ if (o.b > 0){ o.x = Math.max(0, Math.min(W, o.x)); o.vx = -o.vx; o.b--; o.nb++; } else dead = true; }
    if (o.y < 0 || o.y > H){ if (o.b > 0){ o.y = Math.max(0, Math.min(H, o.y)); o.vy = -o.vy; o.b--; o.nb++; } else dead = true; }
    const inside = inBig(o.x, o.y);
    if (!inside) o.out = true;
    else if (o.out && !dead){
      hit(dmg * (1 + o.nb * ricBonus) * Math.pow(stat.keep(), o.d), 'shard', o.x, o.y, o.d);
      if (splitP && o.gen === 0 && Math.random() < splitP){ spawnShards(o.x, o.y, 2, o.d, 1); fx.split(o.x, o.y); }
      if (o.p > 0){ o.p--; o.out = false; const a = Math.atan2(o.vy, o.vx); o.vx = Math.cos(a) * cell * 7; o.vy = Math.sin(a) * cell * 7; }

    }

    fx.boom(e);
  }
  for (let k = zaps.length - 1; k >= 0; k--){
    const z = zaps[k]; z.t -= dt; if (z.t > 0) continue;
    zaps.splice(k, 1);
    const pts = [[z.x, z.y]];
    for (let m = 0; m < z.n; m++){ const [px, py] = bigPoint(); pts.push([px, py]); hit(stat.dmg() * stat.modPow() * 2.5 * Math.pow(stat.keep(), z.d), 'bolt', px, py, z.d); }

  }

  if (combo < 1) milestoneSeen = 0;
  if (shatterPending){ shatterPending = false; if (save.prog >= gaugeNeed()) shatter(); }
  trackDps(dt);
}

      // 桁を下げる前（1タップ=300ダメージ）のセーブは、コインと進みを新しい桁にそろえる
      if (!o.scale2 && o.started){ save.coins *= TUNE.coinK; save.idleRate *= TUNE.coinK; save.st.earnedRun *= TUNE.coinK; save.prog *= .01; } }
    // 数字があふれて∞になったまま保存されたセーブ（null になっている）は、天井の値などで埋め直す
    const fix = (obj, k, v) => { if (obj[k] === null || (typeof obj[k] === 'number' && !Number.isFinite(obj[k]))) obj[k] = v; };
    fix(save, 'coins', 1e250); fix(save, 'idleRate', 0); fix(save, 'prog', 0); fix(save, 'dust', 1e5);
    fix(save.st, 'earnedRun', 1e250); fix(save.st, 'earnedAll', 1e250); fix(save.st, 'bestDust', Math.max(1e5, Number(save.dust) || 0));
    for (const k of ['coins', 'idleRate', 'dust']) save[k] = capN(save[k]);
    for (const k of ['earnedRun', 'earnedAll', 'bestDust']) save.st[k] = capN(save.st[k]);
    // 掘削方式（段数のノルマ）より前のセーブは進み具合の単位が違うので、ノルマ未満に切り詰める
    save.prog = Math.min(Math.floor(save.prog || 0), gaugeNeed() - 1);

    if (save.perm && save.perm.pslot){ for (let k = 0; k < save.perm.pslot; k++) save.dust += Math.ceil(30 * Math.pow(2.5, k)); delete save.perm.pslot; }
    delete save.equip; delete save.slots;

function updateFx(dt){
  const g = cell * 14;
  for (let k = parts.length - 1; k >= 0; k--){
    const p = parts[k]; p.life -= dt;
    if (p.life <= 0){ parts[k] = parts[parts.length - 1]; parts.pop(); continue; }
    if (p.k === 'deb'){ p.vy += g * dt; p.r += p.vr * dt; }
    else if (p.k === 'flame'){ p.vy -= cell * 3 * dt; }
    else { p.vx *= Math.pow(.02, dt); p.vy *= Math.pow(.02, dt); }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let k = floats.length - 1; k >= 0; k--){ const f = floats[k]; f.y += f.vy * dt; f.life -= dt; if (f.life <= 0){ if (floatPool.length < 30) floatPool.push(f.img); floats.splice(k, 1); } }
  for (let k = rings.length - 1; k >= 0; k--){ rings[k].life -= dt; if (rings[k].life <= 0) rings.splice(k, 1); }
  for (let k = bolts.length - 1; k >= 0; k--){ bolts[k].life -= dt; if (bolts[k].life <= 0) bolts.splice(k, 1); }
  for (let k = flashes.length - 1; k >= 0; k--){ flashes[k].life -= dt; if (flashes[k].life <= 0) flashes.splice(k, 1); }
  if (big.burn > 0 && parts.length < MAXP && Math.random() < dt * 30){
    const [fx0, fy0] = bigPoint();
    parts.push({k:'flame', x:fx0, y:fy0, vx:rnd(-.3, .3) * cell, vy:-cell * rnd(.6, 1.4), life:rnd(.3, .55), max:.55, c:Math.random() < .5 ? '#ff7a1a' : '#ffcf3a', s:cell * rnd(.08, .15)});
  }
  flash = Math.max(0, flash - dt * 3); if (flash <= 0) flashColor = '255,255,255';
  zoom *= Math.pow(.004, dt);
  shake = Math.min(shake, 30) * Math.pow(.0006, dt);
  slow = Math.max(0, slow - dt);
}

function renderSheet(keepScroll){

let sheetSig = '';
function refreshSheet(){
  if (sheet.hidden) return;
  // 特殊強化の出現やレベル変化でリストの形が変わるなら描き直す
  const sig = (tab === 'build' ? COMBOS.filter(c => CB(c.id)).length + '|' + MODS.map(m => ML(m.id)).join(',') : '') + tab + ':' + SPECIALS.filter(s => s.cat === tab && !SP(s.id) && s.req()).map(s => s.id).join(',') + (tab === 'ach' ? achCount() : '') + (tab === 'relic' ? save.st.relics : '');
  if (sig !== sheetSig){ sheetSig = sig; renderSheet(true); return; }
  if (tab === 'arms'){ const b = el('dpsBox'); if (b) b.innerHTML = dpsHtml(); }
  sheetBody.querySelectorAll('[data-cid]').forEach(e => {
    const [kind, id] = e.dataset.cid.split(':'); let c, have = save.coins;
    if (kind === 'up'){
      const u = UPG.find(x => x.id === id), l = L(u.id); if (l >= u.max) return;
      const n = buyN(u); c = upCostN(u, n);
      // ×MAX は個数が変わるので、ボタンを作り直さずに表示だけ書き換える
      if (save.buyMode === 'max'){
        const txt = cs(c) + (n > 1 ? `<small>×${n}</small>` : '');
        if (e.innerHTML !== txt){ e.innerHTML = txt; const v = e.closest('.item').querySelector('.val'); if (v) v.textContent = `${u.v(l)} → ${u.v(l + n)}`; }
      }
    }
    else if (kind === 'mod') c = modCost(MODS.find(m => m.id === id));
    else if (kind === 'sp') c = spCost(SPECIALS.find(s => s.id === id));
    else if (kind === 'perm'){ c = permCost(PERM.find(p => p.id === id)); have = save.dust; }
    const can = have >= c;
    const target = (kind === 'up' || kind === 'sp' || kind === 'perm') ? e.closest('.item') : e;
    target.classList.toggle('can', can); target.setAttribute('aria-disabled', String(!can));
  });
  tabsEl.querySelectorAll('.tab').forEach(t => { const k = t.dataset.tab, want = k !== tab && anyAffordable(k); const has = !!t.querySelector('.dot'); if (want && !has) t.insertAdjacentHTML('beforeend', '<span class="dot"></span>'); else if (!want && has) t.querySelector('.dot').remove(); });
}
function openSheet(){ sheet.hidden = false; sheetSig = ''; renderSheet(false); stopHold(); }
function closeSheet(){ sheet.hidden = true; }
// 強化パネルは横スワイプで隣のタブへ移る。指についてくるように少しずらし、離したら切り替える
function goTab(dir){
  const i = TABS.findIndex(([k]) => k === tab), j = i + dir;
  if (j < 0 || j >= TABS.length){ if (!reduceMotion) sheetBody.animate([{transform:`translateX(${-dir * 18}px)`}, {transform:'none'}], {duration:220, easing:'ease-out'}); return; }
  tab = TABS[j][0]; sheetSig = ''; renderSheet(false);
  if (!reduceMotion) sheetBody.animate([{transform:`translateX(${dir * 40}px)`, opacity:.3}, {transform:'none', opacity:1}], {duration:200, easing:'ease-out'});
}
let swX = null, swY = 0, swT = 0, swDir = 0, swipedAt = 0;
sheetBody.addEventListener('touchstart', e => {
  if (e.touches.length !== 1){ swX = null; return; }
  swX = e.touches[0].clientX; swY = e.touches[0].clientY; swT = performance.now(); swDir = 0;
}, {passive:true});
sheetBody.addEventListener('touchmove', e => {
  if (swX === null) return;
  const dx = e.touches[0].clientX - swX, dy = e.touches[0].clientY - swY;
  // 最初に動いた向きで、縦スクロールか横スワイプかを決める
  if (!swDir && Math.hypot(dx, dy) > 10) swDir = Math.abs(dx) > Math.abs(dy) * 1.2 ? 1 : -1;
  if (swDir === 1 && !reduceMotion) sheetBody.style.transform = `translateX(${dx * .35}px)`;
}, {passive:true});
sheetBody.addEventListener('touchend', e => {
  if (swX === null) return;
  const dx = e.changedTouches[0].clientX - swX; swX = null;
  sheetBody.style.transform = '';
  if (swDir === 1 && Math.abs(dx) > 50){ swipedAt = performance.now(); goTab(dx < 0 ? 1 : -1); }
}, {passive:true});
sheetBody.addEventListener('touchcancel', () => { swX = null; sheetBody.style.transform = ''; }, {passive:true});
el('shopBtn').addEventListener('click', () => { initAudio(); sheet.hidden ? openSheet() : closeSheet(); });
el('closeSheet').addEventListener('click', closeSheet);
sheet.addEventListener('click', e => {
  initAudio();
  // スワイプした直後のタップは、ボタンを押したことにしない
  if (performance.now() - swipedAt < 350) return;
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  const buy = (c, f) => { if (save.coins >= c){ save.coins -= c; f(); persist(); sfxBuy(); sheetSig = ''; renderSheet(true); } };
  if (d.tab){ tab = d.tab; sheetSig = ''; renderSheet(false); return; }
  if (d.off){ save.off = save.off || {}; if (save.off[d.off]) delete save.off[d.off]; else save.off[d.off] = 1; persist(); sfxBuy(); renderSheet(true); return; }
  if (d.mode){ save.buyMode = d.mode === 'max' ? 'max' : +d.mode; persist(); sheetSig = ''; renderSheet(true); return; }
  if (d.up){ const u = UPG.find(x => x.id === d.up); const n = buyN(u); if (n > 0 && L(u.id) + n <= u.max) buy(upCostN(u, n), () => save.lv[u.id] = L(u.id) + n); return; }
  if (d.sp){ const s = SPECIALS.find(x => x.id === d.sp); if (!SP(s.id) && s.req()) buy(spCost(s), () => { save.sp[s.id] = 1; showToast(s.name, s.note); if (s.evo){ bigText(s.name.replace('進化：', '') + 'に進化！', .42, '#ffe14d', 2, 7); flash = .8; shake += 12; sfxFever(); } }); return; }
  if (d.mod){ const m = MODS.find(x => x.id === d.mod); if (ML(m.id) < m.max) buy(modCost(m), () => { const was = ML(m.id); save.mods[m.id] = was + 1; }); return; }
  if (d.perm){ const p = PERM.find(x => x.id === d.perm); const c = permCost(p); if (P(p.id) < p.max && save.dust >= c){ save.dust -= c; save.perm[p.id] = P(p.id) + 1; persist(); sfxBuy(); updateStageLabel(); renderSheet(true); } return; }
  if (d.act === 'prestige'){ if (save.stage >= PRESTIGE_STAGE && dustGain() > 0){ closeSheet(); showPrestige(); } return; }
  // プレイデータ：JSON を base64 にして「RENSA1:」を付けた文字列にする（貼り付けで崩れにくいように）
  if (d.act === 'export'){
    persist();
    const code = 'RENSA1:' + btoa(unescape(encodeURIComponent(JSON.stringify(save))));
    const box = el('ioBox'); box.hidden = false; box.value = code; box.focus(); box.select();
    const done = ok => showToast(ok ? 'プレイデータをコピーした' : '下の枠の文字を全部選んでコピーしてね', `${code.length.toLocaleString('ja-JP')}文字`, 'プレイデータ', 4000);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => done(true), () => done(false));
    else { let ok = false; try { ok = document.execCommand('copy'); } catch(e){} done(ok); }
    return;
  }
  if (d.act === 'import'){
    const text = (prompt('コピーしたプレイデータ（RENSA1: から始まる文字）を貼り付けてね。今のデータは上書きされる') || '').trim();
    if (!text) return;
    try {
      const raw = text.startsWith('RENSA1:') ? decodeURIComponent(escape(atob(text.slice(7)))) : text;
      const o = JSON.parse(raw);
      if (!o || typeof o !== 'object' || !('stage' in o) || !('lv' in o)) throw new Error('形が違う');
      if (!confirm(`${STAGES[Math.min(o.stage, STAGES.length - 1)] ? STAGES[Math.min(o.stage, STAGES.length - 1)].name : '?'}・星屑${o.dust || 0}のデータで上書きする？`)) return;
      localStorage.setItem(KEY, JSON.stringify(o)); location.reload();
    } catch(e){ showToast('読み込めなかった', 'コピーした文字を最後まで貼り付けたか確かめてね', 'プレイデータ', 4000); }
    return;
  }
  if (d.act === 'reset'){
    if (t.classList.contains('armed')){
      save = JSON.parse(JSON.stringify(DEFAULT)); persist(); boss = null; lucky = null; tab = 'idle';
      for (const k in buffs) buffs[k] = 0; combo = 0; fever = 0; heat = 0;
      updateStageLabel(); updateProgLabel(); syncMute(); resize(); closeSheet(); showTitle();
    } else { t.classList.add('armed'); t.textContent = 'もう一度押すと全データが消えます'; }
  }
});

    <h1 class="display">おかえり！</h1>
    <p>留守の${fmtT(secs)}のあいだ、ドローンが壊し続けていた。</p>
    <div class="welcome-num display">+${fmt(gain)}</div>
    <button class="go" data-act="claim">受け取る</button></div>`;
}
function showEnding(){
  state = 'ending'; overlay.hidden = false; closeSheet();
  overlay.innerHTML = `<div class="panel center"><h1 class="display">宇宙の核、粉砕。</h1>
    <p>木箱から始めて、宇宙そのものを砕いた。最高コンボは${save.best.toLocaleString('ja-JP')}。</p>
    <p>ここで宇宙を砕けば <b style="color:var(--dust)">+${dustGain()}</b> 星屑。永続強化を買って、次の宇宙をもっと速く壊そう。</p>
    <p>このまま「宇宙の先」へ進むこともできる。深く進むほど稼ぎが増え、砕いたときの星屑も増える。</p>
    <button class="go" data-act="prestige">宇宙を砕く　✦ +${dustGain()}</button>
    <button class="go ghost" data-act="resume">宇宙の先へ進む</button></div>`;
}
function showPrestige(){
  state = 'ending'; overlay.hidden = false;
  overlay.innerHTML = `<div class="panel center"><h1 class="display">宇宙を砕く？</h1>
    <p>強化・モジュール${P('pkeep') ? '（Lvは残る）' : ''}・特殊強化・コインがリセットされ、${STAGES[Math.min(P('pstage'), STAGES.length - 1)].name}からやり直しになる。実績と星屑と永続強化は残る。</p>
    <div class="dust-num display">✦ +${dustGain()}</div>
    <button class="go" data-act="prestige">砕く</button>
    <button class="go ghost" data-act="resume">やめておく</button></div>`;
}
function showNewUniverse(d){
  state = 'ending'; overlay.hidden = false;
  overlay.innerHTML = `<div class="panel center"><h1 class="display">新しい宇宙</h1>
    <div class="dust-num display">✦ ${save.dust}</div>
    <p>星屑を${d}個手に入れた。強化パネルの「砕く」タブで永続強化が買える。</p>
    <p>${save.runs}回目の宇宙。今度はもっと速く、もっと派手に。</p>
    <button class="go" data-act="resume">壊し始める</button></div>`;
}
overlay.addEventListener('click', e => {
  initAudio(); const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.act === 'start'){ save.started = true; persist(); overlay.hidden = true; state = 'play'; }
  else if (t.dataset.act === 'claim'){ earn(welcomeGain); welcomeGain = 0; save.st.offline++; persist(); sfxGold(); overlay.hidden = true; state = 'play'; }
  else if (t.dataset.act === 'resume'){ overlay.hidden = true; state = 'play'; }
  else if (t.dataset.act === 'prestige'){
    const d = prestige(); resize(); updateStageLabel(); updateProgLabel(); persist();
    freeze = .2; shake += 30; flash = 1; zoom = .12; sfxJackpot(); sfxBoom(true);
    showNewUniverse(d);
  }
});

/* ---- 放置・オフライン ---- */
function offline(secsRaw){
  const secs = Math.min((8 + 4 * P('poff')) * 3600, secsRaw);
  if (secs > 60 && save.idleRate > 0){ showWelcome(save.idleRate * secs * .5, secs); return true; }
  return false;
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ persist(); hiddenAt = Date.now(); stopHold(); }
  else { last = performance.now(); if (hiddenAt && state === 'play') offline((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
});

/* ---- ループ ---- */
let last = performance.now(), saveT = 0, refT = 0, achT = 0;
function frame(now){
  // 最初のフレームは描画時刻が記録より前になることがあるので、経過時間は0未満にしない
  const gap = now - last, raw = Math.max(0, Math.min(.05, gap / 1000)); last = now; clock += raw;
  if (state === 'play') adaptQuality(gap);
  const dt = slow > 0 ? raw * .3 : raw;
  if (freeze > 0) freeze -= raw; else { step(dt); updateFx(dt); }
  tickT += raw;
  if (tickT >= 1){
    const rate = earnedTick / tickT;
    // ゲージの進み方（あと約◯分の見積もり用）。素材が変わったらやり直す
    if (progStage === save.stage && !boss && save.prog >= progSample){ const r = (save.prog - progSample) / tickT; progRate = progRate ? progRate * .85 + r * .15 : r; }
    else if (progStage !== save.stage) progRate = 0;
    progStage = save.stage; progSample = save.prog;
    earnedTick = 0; tickT = 0; updateProgLabel();
    dispRate = dispRate ? dispRate * .7 + rate * .3 : rate;
    if (state === 'play' && lastTap > 8) save.idleRate = save.idleRate ? save.idleRate * .9 + rate * .1 : rate;
  }
  render(); hud(raw); tickNews(raw);
  achT += raw; if (achT > 1){ achT = 0; if (state === 'play') checkAch(); }
  refT += raw; if (refT > .4){ refT = 0; refreshSheet(); shopDot.hidden = !(sheet.hidden && TABS.some(([k]) => anyAffordable(k))); }
  saveT += raw; if (saveT > 5){ saveT = 0; persist(); }
  requestAnimationFrame(frame);
}
load();
new ResizeObserver(() => resize()).observe(stageEl);
resize(); updateStageLabel(); updateProgLabel(); syncMute(); syncFx();
if (!save.started) showTitle();
else { state = 'play'; if (save.t) offline((Date.now() - save.t) / 1000); }
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
