<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>連鎖破壊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e3e8ef; --surface:#f6f8fb; --ink:#1a2130; --muted:#5a6577; --line:#c4cdd9;
  --accent:#e0215f; --accent-deep:#a3123f; --coin:#a86f00; --coin-bg:#f6b400;
  --scrim:rgba(227,232,239,.9); --on-accent:#ffffff; --good:#0f8a5f; --dust:#6a43c4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161f; --surface:#1a2330; --ink:#edf1f6; --muted:#93a0b3; --line:#2b3645;
    --accent:#ff4c88; --accent-deep:#b21b50; --coin:#ffc53a; --coin-bg:#ffc53a;
    --scrim:rgba(16,22,31,.92); --on-accent:#ffffff; --good:#3ddc97; --dust:#b48cff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161f; --surface:#1a2330; --ink:#edf1f6; --muted:#93a0b3; --line:#2b3645;
  --accent:#ff4c88; --accent-deep:#b21b50; --coin:#ffc53a; --coin-bg:#ffc53a;
  --scrim:rgba(16,22,31,.92); --on-accent:#ffffff; --good:#3ddc97; --dust:#b48cff;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-weight:500;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
.display{font-family:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-weight:400}
button{font:inherit;color:inherit}

/* HUD */
.hud{padding:6px 14px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.purse{min-width:0;line-height:1}
.coins{display:flex;align-items:baseline;gap:6px}
#coins{font-size:clamp(28px,8.6vw,44px);color:var(--coin);white-space:nowrap;font-variant-numeric:tabular-nums}
.coins small{font-size:12px;color:var(--muted);font-weight:700}
#prod{display:block;margin-top:4px;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
#prod b{color:var(--good)}
#prod .mul{color:var(--accent);margin-left:6px}
.hud-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
#stageName{font-size:13px;padding:4px 10px;border-radius:8px;background:var(--surface);border:1.5px solid var(--line);white-space:nowrap}
#stageSwatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
#dustTag{font-size:12px;font-weight:700;color:var(--dust);white-space:nowrap}
#dustTag[hidden]{display:none}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0}
.news{padding:0 14px 4px;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.news b{color:var(--accent)}

/* Arena */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#0b0f15}
#cv{display:block;touch-action:none;cursor:crosshair}
.chain{position:absolute;left:0;right:0;top:8px;text-align:center;pointer-events:none;opacity:0;line-height:1;color:#fff}
#chainNum{font-size:clamp(44px,14vw,80px);display:inline-block;transform-origin:50% 60%;
  text-shadow:0 0 18px currentColor,0 3px 0 #000,0 -2px 0 #000,3px 0 0 #000,-3px 0 0 #000}
#chainLabel{font-size:18px;margin-left:4px;text-shadow:0 2px 0 #000,0 0 10px currentColor}
#chainMult{display:block;margin-top:4px;font-size:15px;font-weight:700;color:#ffd84d;text-shadow:0 2px 0 #000}
#chainTier{display:block;margin-top:2px;font-size:14px;text-shadow:0 2px 0 #000,0 0 8px currentColor}
#fever{position:absolute;left:0;right:0;top:44%;text-align:center;pointer-events:none;opacity:0;transform:translateY(-50%)}
#fever span{font-size:clamp(40px,13vw,76px);color:#fff;display:inline-block;
  text-shadow:0 0 20px #ff4c88,0 0 40px #ffd84d,0 4px 0 #000;animation:pulse .5s ease-in-out infinite alternate}
#fever small{display:block;font-size:14px;color:#fff;font-weight:700;margin-top:6px;text-shadow:0 2px 0 #000}
@keyframes pulse{from{transform:scale(1) rotate(-3deg);filter:hue-rotate(0)}to{transform:scale(1.08) rotate(3deg);filter:hue-rotate(160deg)}}
#buffs{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.buff{font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border-radius:8px;padding:4px 8px;border-left:4px solid var(--c,#ffd84d);text-shadow:0 1px 0 #000}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-140%);background:rgba(0,0,0,.8);color:#fff;border-radius:12px;padding:8px 14px;
  font-size:13px;font-weight:700;border:2px solid #ffd84d;max-width:88%;text-align:center;transition:transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;z-index:3}
.toast.show{transform:translate(-50%,0)}
.toast b{color:#ffd84d;display:block;font-size:11px;margin-bottom:2px}

/* Bottom bar */
.bar{padding:6px 14px 10px}
.gauge{height:5px;border-radius:3px;background:var(--surface);overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}
#feverFill{height:100%;width:0;background:linear-gradient(90deg,#ff4c88,#ffd84d,#3ddc97,#4cc9ff,#b48cff)}
.row{display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.prog-label span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
.prog-bar{height:12px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line);overflow:hidden}
#progFill{height:100%;width:0;background:var(--accent);transition:width .2s}
#progFill.boss{background:linear-gradient(90deg,#ff4c88,#ff8a1f)}
.shop-btn{position:relative;appearance:none;border:0;cursor:pointer;border-radius:999px;padding:12px 22px;font-size:17px;
  background:var(--ink);color:var(--bg);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.shop-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.shop-btn .dot{position:absolute;top:6px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.shop-btn .dot[hidden]{display:none}

/* Overlay */
.overlay{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;color:var(--ink);z-index:4}
.overlay[hidden]{display:none}
.panel{width:100%;max-width:540px;margin:0 auto;padding:16px 16px 8px;flex:1}
.center{display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:100%}
.big-title{margin:0;font-size:clamp(72px,24vw,132px);line-height:.92;letter-spacing:-.02em;color:var(--accent)}
.big-title span{display:block;color:var(--ink);transform:translateX(.5em)}
.center p{margin:0;max-width:32em;line-height:1.75;font-size:15px}
.center h1.display{margin:0;font-size:clamp(44px,14vw,80px);line-height:1.05;color:var(--accent)}
.welcome-num{font-size:clamp(36px,11vw,60px);color:var(--coin);line-height:1.1}
.dust-num{font-size:clamp(36px,11vw,60px);color:var(--dust);line-height:1.1}

.go,.buy{appearance:none;border:0;cursor:pointer;width:100%;border-radius:999px;
  font-family:"Dela Gothic One",system-ui,sans-serif;font-size:20px;padding:15px 20px;
  background:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s}
.go:active,.buy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.go.ghost{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.buy{font-size:15px;padding:10px 16px}
.buy:disabled{background:var(--surface);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default}
.small{appearance:none;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:18px 0 4px;cursor:pointer}
.small.armed{color:var(--accent);font-weight:700}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;height:74%;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.25);color:var(--ink);z-index:2}
.sheet[hidden]{display:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer;position:relative;white-space:nowrap;flex-shrink:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 24px}
.close{flex-shrink:0}
.hint{font-size:12px;color:var(--muted);margin:10px 0 6px;line-height:1.6}
.modes{display:flex;gap:4px;margin:6px 0 2px}
.mode{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.mode.on{background:var(--accent);border-color:var(--accent);color:#fff}

.list{list-style:none;margin:6px 0 0;padding:0;border-top:1.5px solid var(--line)}
.list li{border-bottom:1.5px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:11px 2px;align-items:center}
.item.btn{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:11px 2px;align-items:center;cursor:pointer}
.name{font-weight:700;font-size:15px}
.name .lv{font-size:12px;color:var(--muted);margin-left:6px}
.val{font-size:13px;font-weight:700;color:var(--accent)}
.note{grid-column:1 / -1;font-size:12px;color:var(--muted);line-height:1.5}
.cost{grid-column:2;grid-row:1 / span 2;justify-self:end;font-family:"Dela Gothic One",system-ui,sans-serif;font-size:14px;
  padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap;background:none;cursor:pointer}
.cost small{font-family:inherit;font-size:10px;display:block;text-align:center;line-height:1}
.can .cost,.cost.can{background:var(--coin-bg);border-color:var(--coin-bg);color:#1a1200}
.cost.dust{border-color:var(--dust);color:var(--dust)}
.can .cost.dust,.cost.dust.can{background:var(--dust);border-color:var(--dust);color:#fff}
.item.btn[aria-disabled="true"]{cursor:default}
.item.btn[aria-disabled="true"] .name,.item.btn[aria-disabled="true"] .val{opacity:.6}
.acts{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.eq{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.eq.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.eq:disabled{opacity:.45;cursor:default}
.locked .name{color:var(--muted)}
.done .name{color:var(--good)}
.slots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.slot{flex:1;min-width:64px;padding:10px 6px;border-radius:10px;border:2px solid var(--accent);text-align:center;font-weight:700;font-size:14px}
.slot.empty{border-style:dashed;border-color:var(--line);color:var(--muted)}
.slot.lockd{border-style:dashed;border-color:var(--line);color:var(--muted);font-size:12px}
.section-title{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:8px 0;font-size:13px}
.stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.stats b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:8px}
.ach div{border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:12px;line-height:1.4;background:var(--surface)}
.ach div.got{border-color:var(--coin-bg);background:color-mix(in srgb,var(--coin-bg) 15%,var(--surface))}
.ach b{display:block;font-size:13px}
.ach .d{color:var(--muted)}
.ach div:not(.got){opacity:.55}
.prestige-box{margin:10px 0;padding:14px;border-radius:14px;border:2px solid var(--dust);text-align:center}
.prestige-box .dust-num{font-size:clamp(30px,9vw,48px)}
.prestige-box p{margin:6px 0;font-size:13px;line-height:1.6}
.go:focus-visible,.buy:focus-visible,.item.btn:focus-visible,.cost:focus-visible,.eq:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.small:focus-visible,.mode:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

@media (prefers-reduced-motion: reduce){#fever span{animation:none}.go,.buy{transition:none}}
</style>
</head>
<body>
<header class="hud">
  <div class="purse">
    <div class="coins"><span id="coins" class="display">0</span><small>コイン</small></div>
    <span id="prod"></span>
  </div>
  <div class="hud-side">
    <div style="display:flex;gap:6px;align-items:center">
      <span id="stageName"><span id="stageSwatch"></span><span id="stageText"></span></span>
      <button id="mute" class="icon-btn" aria-label="音を消す">🔊</button>
    </div>
    <span id="dustTag" hidden></span>
  </div>
</header>
<div class="news" id="news"></div>
<main id="stage">
  <canvas id="cv" aria-label="ブロックのフィールド。タップで壊す"></canvas>
  <div class="chain" id="chain"><span id="chainNum" class="display">0</span><span id="chainLabel" class="display">コンボ</span><span id="chainTier" class="display"></span><span id="chainMult"></span></div>
  <div id="fever"><span class="display">フィーバー！</span><small>報酬3倍・威力2倍・連射2倍</small></div>
  <div id="buffs"></div>
  <div class="toast" id="toast"><b>実績解除</b><span id="toastText"></span></div>
  <div class="overlay" id="overlay" hidden></div>
  <section class="sheet" id="sheet" hidden aria-label="強化">
    <div class="sheet-head">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="icon-btn close" id="closeSheet" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</main>
<footer class="bar">
  <div class="gauge" title="フィーバーゲージ"><div id="feverFill"></div></div>
  <div class="row">
    <div class="prog"><div class="prog-label"><span id="progText">次のボスまで</span><span id="progNum"></span></div><div class="prog-bar"><div id="progFill"></div></div></div>
    <button class="shop-btn display" id="shopBtn">強化<span class="dot" id="shopDot" hidden></span></button>
  </div>
</footer>
<script>
(() => {

const UNITS = ['', '万', '億', '兆', '京', '垓', '秭', '穣', '溝', '澗', '正', '載', '極', '恒河沙', '阿僧祇', '那由他', '不可思議', '無量大数'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 10000) return Math.floor(n).toLocaleString('ja-JP');
  const k = Math.floor(Math.log10(n) / 4);
  if (k >= UNITS.length) return n.toExponential(2).replace('e+', 'e');
  const v = n / Math.pow(10, 4 * k);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + UNITS[k];
}
const fmtX = x => x < 100 ? x.toFixed(x < 10 ? 2 : 1) : fmt(x);
const fmtT = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}時間${m}分` : `${m}分`; };

const STAGES = [
  {name:'木箱',     color:'#d08a45', dark:'#8a5726', glow:'#ffb36b', bg:'#1a1410'},
  {name:'石',       color:'#a3acb7', dark:'#636d79', glow:'#e4ecf5', bg:'#12161c'},
  {name:'鉄',       color:'#6f88a0', dark:'#3c4f63', glow:'#a9d4ff', bg:'#0d141d'},
  {name:'水晶',     color:'#7fe0f0', dark:'#2f9db5', glow:'#c9fbff', bg:'#071a22'},
  {name:'溶岩',     color:'#ff6a2b', dark:'#a3300f', glow:'#ffb15c', bg:'#1f0b06'},
  {name:'隕石',     color:'#9a74b0', dark:'#563b6c', glow:'#e0b8ff', bg:'#130b1c'},
  {name:'星',       color:'#ffd84d', dark:'#c99a10', glow:'#fff3b0', bg:'#14110a'},
  {name:'銀河',     color:'#b48cff', dark:'#6a43c4', glow:'#ffb3ff', bg:'#0c0820'},
  {name:'暗黒物質', color:'#4a4f6a', dark:'#23263a', glow:'#8f9bff', bg:'#05050c'},
  {name:'時空',     color:'#3fd9c0', dark:'#1a7f70', glow:'#b8fff2', bg:'#031a18'},
  {name:'次元',     color:'#ff7ad9', dark:'#a3287f', glow:'#ffd1f4', bg:'#1a0616'},
  {name:'宇宙',     color:'#ffffff', dark:'#6a6a7a', glow:'#ffffff', bg:'#000000'},
];
const PRESTIGE_STAGE = 8;   // この素材に到達したら「砕く」が解放される
const F_VAL = 1e5;
const sv = s => Math.pow(F_VAL, s);
// 値段は価値の伸びに加えて、コンボや金ブロックなど倍率の積み上がりぶん（costStage）も上乗せする
const priceSv = s => sv(s) * Math.pow(TUNE.costStage, s);
const TUNE = {fhp:4000, fhpLate:3000, fdmg:2000, gaugeBase:100000, gaugeGrow:3.0, gaugeCapK:6, gaugeLate:1.8, tapProg:3, dustBase:18, dustDiv:8, dustBonus:.005, pmultBonus:.25, costX:3, costStage:1.45, droneDmg:5, droneInt:1.5, bossHp:1500, bossGrow:1.35, bossReward:300, comboDecay:.6};
const DEFAULT = {
  coins:0, stage:0, lv:{}, mods:{}, equip:[], slots:2, best:0, ended:false, muted:false, t:0, idleRate:0, prog:0, started:false, kills:0, boss:null,
  sp:{}, ach:{}, dust:0, perm:{}, runs:0, buyMode:1, endSeen:false,
  st:{destroyed:0, taps:0, bosses:0, lucky:0, fevers:0, time:0, earnedRun:0, earnedAll:0, offline:0, bestDust:0, bigCombo:0},
};
let save = JSON.parse(JSON.stringify(DEFAULT));
const L = id => save.lv[id] || 0;
const ML = id => save.mods[id] || 0;
const M = id => save.equip.includes(id) ? ML(id) : 0;
const SP = id => !!save.sp[id];
const P = id => save.perm[id] || 0;

const UPG = [
  // 放置
  {cat:'idle', id:'drones',   name:'ドローンの台数', note:'勝手に撃ち続けるドローン',           cost:800,   g:3.10,  max:11,  v:l => `${1+l+P('pdrone')}台`},
  {cat:'idle', id:'droneint', name:'連射速度',       note:'ドローンが撃つ間隔',                 cost:600,   g:2.40,  max:14,  v:l => `${(TUNE.droneInt*Math.pow(.85,l)*(SP('rl1')?.8:1)).toFixed(2)}秒`},

function settle(){
  for (let c = 0; c < cols; c++){
    let bottom = rows - 1;
    while (bottom >= 0){
      while (bottom >= 0 && blocks[bottom * cols + c].boss) bottom--;
      if (bottom < 0) break;
      let top = bottom;
      while (top - 1 >= 0 && !blocks[(top - 1) * cols + c].boss) top--;
      let w = bottom;
      for (let r = bottom; r >= top; r--){
        const b = blocks[r * cols + c];
        if (!b.alive) continue;
        if (w !== r){ blocks[w * cols + c] = b; b.fy += w - r; }
        w--;
      }
      const empty = w - top + 1;
      for (let r = w; r >= top; r--){ const nb = newBlock(); nb.spawn = 1; nb.fy = empty + rnd(0, .3); blocks[r * cols + c] = nb; }
      bottom = top - 1;

  }

const bossX = () => (cx(boss.cells[0]) + cx(boss.cells[1])) / 2;
const bossY = () => (cy(boss.cells[0]) + cy(boss.cells[2])) / 2;
function earn(gain){ save.coins += gain; earnedTick += gain; save.st.earnedRun += gain; save.st.earnedAll += gain; return gain; }
function hitBoss(dmg, src){
  if (!boss) return;
  let crit = false;
  if (src !== 'burn' && Math.random() < stat.crit()){ dmg *= stat.critX(); crit = true; }
  if (fever > 0) dmg *= 2;
  boss.hp -= dmg; boss.flash = 1; save.boss.hp = boss.hp;
  fx.bossHit(dmg, crit);

}
function killBoss(){
  const b = boss; boss = null; save.boss = null;
  const gain = earn(100 * sv(save.stage) * TUNE.bossReward * comboMult() * rewardMult());
  save.kills++; save.st.bosses++; save.prog = 0;
  const prevStage = save.stage;
  if (save.stage < STAGES.length - 1) save.stage++; else save.ended = true;
  for (let i = 0; i < blocks.length; i++) blocks[i] = newBlock();
  fx.bossDie(b, gain, prevStage);
}

function spawnLucky(){
  const side = Math.random() < .5 ? -1 : 1, y = offY + cell * (1 + Math.random() * (rows - 2));
  lucky = {x:side < 0 ? -cell : W + cell, y, vx:-side * cell * .55, vy:0, life:14 + (SP('lk3') ? 4 : 0), ph:Math.random() * 6, r:cell * .42};
  fx.lucky(lucky);
}
function hitLucky(){
  const lk = lucky; lucky = null; save.st.lucky++;
  const dur = SP('lk3') ? 1.5 : 1;
  const roll = Math.random(); let kind, text;
  if (roll < .36){ kind = 'frenzy'; buffs.frenzy = 60 * dur; text = 'フレンジー！　報酬 ×7'; }
  else if (roll < .58){ kind = 'barrage'; buffs.barrage = 25 * dur; text = '弾幕！　ドローン連射 ×8'; }
  else if (roll < .76){ kind = 'rain'; const g = earn(Math.max(100 * sv(save.stage) * 200, save.idleRate * 900) * rewardMult()); text = 'コイン雨！　+' + fmt(g); }
  else if (roll < .92){ kind = 'awaken'; buffs.awaken = 20 * dur; text = '覚醒！　クリティカル100%'; }
  else { kind = 'storm'; buffs.storm = 1; text = '破片嵐！'; spawnShards(lk.x, lk.y, 400, -1, 0); }
  if (SP('lk4')) spawnShards(lk.x, lk.y, 100, -1, 0);
  heat = Math.min(100, heat + 30);
  fx.luckyHit(lk, text, kind);
}

function tap(x, y, auto){
  if (state !== 'play') return false;
  if (!auto){ lastTap = 0; save.st.taps++; }
  if (!auto && lucky && Math.hypot(lucky.x - x, lucky.y - y) < lucky.r * 1.6){ hitLucky(); fx.tap(x, y); return true; }
  const fv = stat.fever();
  if (fever > 0){ if (SP('fv1')) fever = Math.min(fv * 2, fever + stat.heat() / 100 * fv * .5); }
  else { heat += stat.heat() * (auto ? .5 : 1); if (heat >= 100){ heat = 0; fever = fv; save.st.fevers++; fx.fever(); } }
  const i = cellAt(x, y);
  if (i >= 0 && blocks[i].boss && boss){ hitBoss(stat.dmg() * 25 * stat.tapPow(), 'tap'); spawnShards(x, y, stat.shards() * stat.tapburst(), i, 0); }
  else if (i >= 0 && blocks[i].alive) breakBlock(i, stat.tapburst(), auto ? 'auto' : 'tap');
  else spawnShards(x, y, stat.shards() * stat.tapburst(), i, 0);
  const tb = stat.tapboom();
  if (tb) booms.push({x, y, i:Math.max(0, i), R:cell * (1 + .3 * tb + (SP('sw1') ? 1 : 0)), dmg:stat.dmg() * tb * 2 * stat.tapPow(), t:.04, big:false, quiet:true});
  fx.tap(x, y);
  return true;
}
// d：連鎖の深さ。深いほど威力が stat.keep() 倍ずつ落ちる
function spawnShards(x, y, n, from, gen, d = 0){
  const sp = cell * (7 + Math.random() * 3), off = Math.random() * 6.283;
  const ric = M('ricochet'), b = ric ? 1 + ric : 0, p = M('pierce');
  for (let k = 0; k < n; k++){
    if (shards.length >= MAXS) break;
    const a = off + k / n * 6.283 + (Math.random() - .5) * .4, v = sp * (.85 + Math.random() * .3);
    shards.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:gen ? .55 : .8 + Math.random() * .5, b, p, nb:0, cell:from, gen, tg:-1, tt:0, d});
  }
}
function nearest(x, y, maxD, skip){
  const c0 = Math.floor((x - offX) / cell), r0 = Math.floor((y - offY) / cell), R = Math.ceil(maxD / cell);
  let best = -1, bd = maxD * maxD, foundRing = -1;
  for (let k = 0; k <= R; k++){
    if (foundRing >= 0 && k > foundRing + 1) break;
    for (let r = r0 - k; r <= r0 + k; r++){
      if (r < 0 || r >= rows) continue;
      const edge = (r === r0 - k || r === r0 + k);
      for (let c = c0 - k; c <= c0 + k; c += (edge || k === 0) ? 1 : 2 * k){
        if (c < 0 || c >= cols) continue;
        const j = r * cols + c;
        if (!solid(j) || blocks[j].boss || (skip && skip.has(j))) continue;
        const dx = cx(j) - x, dy = cy(j) - y, d = dx * dx + dy * dy;
        if (d < bd){ bd = d; best = j; if (foundRing < 0) foundRing = k; }
      }
    }
  }
  return best;
}
function hit(i, dmg, src, d = 0){
  const b = blocks[i];
  if (b.boss){ hitBoss(dmg, src); return; }
  if (!b.alive) return;
  let crit = false;
  if (src !== 'burn' && Math.random() < stat.crit()){ dmg *= stat.critX(); crit = true; }
  if (fever > 0) dmg *= 2;
  b.hp -= dmg; b.flash = 1;
  fx.hit(i, dmg, crit, src);
  if (src === 'shard' && M('burn')){ b.burn = 2; b.burnDps = Math.max(b.burnDps, stat.dmg() * .8 * (1 + .3 * (M('burn') - 1))); }
  if (src === 'shard' && M('burn')) b.bd = d;
  if (b.hp <= 0) breakBlock(i, 1, src, d);
}
function breakBlock(i, burst, src, d = 0){
  const b = blocks[i]; if (!b.alive) return;
  blocks[i] = deadBlock();
  combo += 1; save.st.destroyed++;
  const gain = earn(b.value * comboMult() * rewardMult());
  // ボスゲージは稼いだ額で進む（普通のブロック1個・倍率なし＝1）。直接タップで壊すと tapProg 倍
  if (!boss){ save.prog += gain / (100 * sv(save.stage)) * (src === 'tap' ? TUNE.tapProg : 1); if (save.prog >= gaugeNeed()) spawnBoss(null); }
  const x = cx(i), y = cy(i);
  const nd = d + 1, kp = Math.pow(stat.keep(), nd);
  spawnShards(x, y, stat.shards() * burst, i, 0, nd);
  if (b.type === 'bomb') booms.push({x, y, i, R:cell * 1.7 * (SP('bm1') ? 1.3 : 1), dmg:stat.dmg() * 5 * (SP('bm1') ? 2 : 1) * kp, t:.08, big:true, d:nd});
  const bl = M('blast');
  if (bl && b.type !== 'bomb' && Math.random() < Math.min(.5, .08 + .04 * (bl - 1))) booms.push({x, y, i, R:cell * 1.25, dmg:stat.dmg() * 2 * kp, t:.08, big:false, d:nd});
  const bo = M('bolt');
  if (bo && Math.random() < Math.min(.6, .15 + .05 * (bo - 1))) zaps.push({i, x, y, n:2 + Math.floor((bo - 1) / 2), t:.05, d:nd});
  if (b.burn > 0 && M('burn')){
    const c = i % cols, r = Math.floor(i / cols);
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dc, dr]) => {
      const nc = c + dc, nr = r + dr; if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) return;
      const nb = blocks[nr * cols + nc]; if (nb.alive){ nb.burn = 2; nb.burnDps = Math.max(nb.burnDps, b.burnDps * stat.keep()); nb.bd = nd; }
    });

}
function droneTarget(){
  const pool = [];
  for (let j = 0; j < blocks.length; j++){ const b = blocks[j]; if (b.alive) pool.push(j); }
  if (boss && Math.random() < .35) return -2;
  if (!pool.length) return boss ? -2 : -1;
  let best = pool[(Math.random() * pool.length) | 0], bs = -1;
  for (let t = 0; t < 4; t++){
    const j = pool[(Math.random() * pool.length) | 0], b = blocks[j];
    const s = (b.type === 'bomb' ? 8 : b.type === 'gold' ? 4 : 0) + Math.random() * 3;
    if (s > bs){ bs = s; best = j; }
  }
  return best;
}
function fireDrone(d){
  const j = droneTarget();
  if (j === -1) return;
  const tx = j === -2 ? bossX() : cx(j), ty = j === -2 ? bossY() : cy(j);
  const dx = tx - d.x, dy = ty - d.y, len = Math.hypot(dx, dy) || 1, v = cell * 16;
  bullets.push({x:d.x, y:d.y, vx:dx / len * v, vy:dy / len * v, tx, ty, j, life:len / v + .05});

function step(dt){

  settle();

  for (let i = 0; i < blocks.length; i++){
    const b = blocks[i];
    if (b.flash > 0) b.flash -= dt * 8;
    if (!b.alive) continue;
    if (b.spawn < 1) b.spawn = Math.min(1, b.spawn + dt * 5);
    if (b.fy > 0){
      b.vy += 45 * dt; b.fy -= b.vy * dt;
      if (b.fy <= 0){
        const v = b.vy; b.fy = 0; b.vy = 0;
        const below = i + cols;
        fx.land(i, v);
        if (fallP && v > 4 && below < blocks.length && (blocks[below].alive || blocks[below].boss)) hit(below, stat.dmg() * fallP, 'fall');
      }
    }
    if (b.alive && b.burn > 0){ b.burn -= dt; b.hp -= b.burnDps * dt * (fever > 0 ? 2 : 1); if (b.hp <= 0) breakBlock(i, 1, 'burn', b.bd || 0); }
  }
  if (boss){ if (boss.spawn < 1) boss.spawn = Math.min(1, boss.spawn + dt * 2); if (boss.flash > 0) boss.flash -= dt * 8; }
  // 幸運ブロック
  luckyT -= dt;
  if (!lucky && luckyT <= 0){ spawnLucky(); luckyT = luckyInterval() * (.7 + Math.random() * .6); }
  if (lucky){
    lucky.ph += dt; lucky.x += lucky.vx * dt; lucky.y += Math.sin(lucky.ph * 1.3) * cell * .6 * dt; lucky.life -= dt;
    if (lucky.life <= 0 || lucky.x < -cell * 1.5 || lucky.x > W + cell * 1.5) lucky = null;
  }
  // 自動タップ（星屑）
  if (P('pauto')){
    autoT += dt;
    if (autoT >= 1 / P('pauto')){
      autoT = 0;
      const al = []; for (let j = 0; j < blocks.length; j++) if (blocks[j].alive) al.push(j);
      if (boss && Math.random() < .5) tap(bossX(), bossY(), true);
      else if (al.length){ const j = al[(Math.random() * al.length) | 0]; tap(cx(j), cy(j), true); }
    }
  }
  // ドローン
  const nd = stat.drones(), di = stat.droneInt() * (fever > 0 ? .5 : 1);
  for (let k = 0; k < nd; k++){
    const d = drones[k]; d.ph += dt;
    d.t -= dt;
    if (d.t <= 0){
      d.t = di * (.8 + Math.random() * .4);
      fireDrone(d); if (SP('rl2')) fireDrone(d);
    }
  }
  for (let k = bullets.length - 1; k >= 0; k--){
    const u = bullets[k]; u.x += u.vx * dt; u.y += u.vy * dt; u.life -= dt;
    if (u.life <= 0){
      bullets.splice(k, 1);
      const i = cellAt(u.tx, u.ty);
      if (i >= 0 && (blocks[i].alive || blocks[i].boss)) hit(i, stat.dmg() * stat.droneDmg(), 'drone');
      const ex = stat.drburst(); if (ex) spawnShards(u.tx, u.ty, ex, i, 0);
    }
  }
  const dmg = stat.dmg(), stepLen = cell * .3, hom = M('homing'), sp = M('split');
  const ricBonus = M('ricochet') ? .25 + .05 * (M('ricochet') - 1) : 0;
  const splitP = sp ? Math.min(.8, .2 + .07 * (sp - 1)) : 0;
  for (let s = shards.length - 1; s >= 0; s--){
    const o = shards[s]; let dead = false;
    if (hom){

      if (o.tt <= 0){ o.tt = .12; o.tg = nearest(o.x, o.y, cell * 3.5); }
      if (o.tg >= 0 && blocks[o.tg].alive){
        const want = Math.atan2(cy(o.tg) - o.y, cx(o.tg) - o.x), cur = Math.atan2(o.vy, o.vx);
        let d = want - cur; while (d > Math.PI) d -= 6.283; while (d < -Math.PI) d += 6.283;

    }

    for (let k = 0; k < n && !dead; k++){
      o.x += o.vx * sub; o.y += o.vy * sub;
      if (o.x < 0){ if (o.b > 0){ o.x = -o.x; o.vx = -o.vx; o.b--; o.nb++; } else dead = true; }
      else if (o.x > W){ if (o.b > 0){ o.x = 2 * W - o.x; o.vx = -o.vx; o.b--; o.nb++; } else dead = true; }
      if (o.y < 0){ if (o.b > 0){ o.y = -o.y; o.vy = -o.vy; o.b--; o.nb++; } else dead = true; }
      else if (o.y > H){ if (o.b > 0){ o.y = 2 * H - o.y; o.vy = -o.vy; o.b--; o.nb++; } else dead = true; }
      if (dead) break;
      const i = cellAt(o.x, o.y);
      if (i !== o.cell){
        o.cell = i;
        if (i >= 0 && solid(i)){
          hit(i, dmg * (1 + o.nb * ricBonus) * Math.pow(stat.keep(), o.d), 'shard', o.d);
          if (splitP && o.gen === 0 && Math.random() < splitP){
            const base = Math.atan2(o.vy, o.vx), v = Math.hypot(o.vx, o.vy);
            for (const da of [-.7, .7]){
              if (shards.length >= MAXS) break;
              const a = base + da + (Math.random() - .5) * .5;
              shards.push({x:o.x, y:o.y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:.55, b:o.b, p:0, nb:o.nb, cell:i, gen:1, tg:-1, tt:0, d:o.d});
            }
            fx.split(o.x, o.y);
          }
          if (o.p > 0) o.p--; else dead = true;
        }
      }
    }
    o.life -= dt; if (o.life <= 0) dead = true;
    if (dead){ shards[s] = shards[shards.length - 1]; shards.pop(); }
  }
  for (let k = booms.length - 1; k >= 0; k--){
    const e = booms[k]; e.t -= dt; if (e.t > 0) continue;
    booms.splice(k, 1);
    const ec = Math.floor((e.x - offX) / cell), er = Math.floor((e.y - offY) / cell), span = Math.ceil(e.R / cell);
    for (let r = er - span; r <= er + span; r++) for (let c = ec - span; c <= ec + span; c++){
      if (r < 0 || c < 0 || r >= rows || c >= cols) continue;
      const j = r * cols + c;
      if (solid(j) && Math.hypot(cx(j) - e.x, cy(j) - e.y) <= e.R) hit(j, e.dmg, 'boom', e.d || 0);
    }
    fx.boom(e);
  }
  for (let k = zaps.length - 1; k >= 0; k--){
    const z = zaps[k]; z.t -= dt; if (z.t > 0) continue;
    zaps.splice(k, 1);
    const skip = new Set(), pts = [[z.x, z.y]]; let px = z.x, py = z.y;
    for (let m = 0; m < z.n; m++){
      const j = nearest(px, py, cell * 4, skip); if (j < 0) break;
      skip.add(j); px = cx(j); py = cy(j); pts.push([px, py]);
      hit(j, stat.dmg() * 3 * Math.pow(stat.keep(), z.d), 'bolt', z.d);
    }
    if (pts.length > 1) fx.bolt(pts);
  }
  if (fever > 0) fever = Math.max(0, fever - dt); else heat = Math.max(0, heat - 6 * dt);
  for (const k in buffs) if (buffs[k] > 0) buffs[k] = Math.max(0, buffs[k] - dt);
  combo = Math.max(0, combo - combo * stat.decay() * dt);

}

function prestige(){
  const d = dustGain();
  save.dust += d; save.st.bestDust += d; save.runs++;
  const keepMods = P('pkeep') ? save.mods : {};
  Object.assign(save, {coins:0, stage:Math.min(P('pstage'), STAGES.length - 1), lv:{}, mods:keepMods, equip:[], slots:2 + P('pslot'), ended:false, endSeen:false, prog:0, kills:0, boss:null, sp:{}, idleRate:0});

  for (const k in buffs) buffs[k] = 0;

let actx = null, master = null, noiseBuf = null, lastSfx = 0, lastZap = 0, lastShot = 0;
function initAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = .4; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * .5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch(e) { actx = null; }
}
function tone(freq, dur, type, vol, delay = 0, slide = .62){
  if (!actx || save.muted) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, freq, vol){
  if (!actx || save.muted) return;
  const t = actx.currentTime, src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + .05);
}
function sfxPop(c){
  if (!actx || save.muted) return;
  const now = actx.currentTime; if (now - lastSfx < .03) return; lastSfx = now;
  tone(240 * Math.pow(2, Math.min(c, 60) / 2.5 / 12) * (.97 + Math.random() * .06), .08, 'triangle', .12);
}
const sfxBoom = big => { noise(big ? .45 : .22, big ? 900 : 1500, big ? .5 : .22); tone(big ? 80 : 130, .3, 'sine', big ? .4 : .15); };
const sfxGold = () => { tone(880, .12, 'sine', .14, 0, 1); tone(1320, .18, 'sine', .12, .05, 1); };
const sfxChime = () => { tone(660, .2, 'square', .06, 0, 1); tone(990, .2, 'square', .06, .07, 1); tone(1320, .3, 'square', .06, .14, 1); };
const sfxZap = () => { if (!actx) return; const n = actx.currentTime; if (n - lastZap < .06) return; lastZap = n; tone(1800, .08, 'sawtooth', .05, 0, .3); };
const sfxFever = () => { [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, .25, 'square', .07, k * .06, 1)); noise(.6, 3000, .2); };
const sfxBuy = () => tone(1200, .07, 'triangle', .1, 0, 1.4);
const sfxShot = () => { if (!actx) return; const n = actx.currentTime; if (n - lastShot < .05) return; lastShot = n; tone(900, .05, 'square', .035, 0, .5); };
const sfxBoss = () => { tone(55, 1.2, 'sawtooth', .25, 0, .7); noise(.8, 400, .35); };

const MAXP = 1100;
function sparks(x, y, n, color, speed = 8){
  for (let k = 0; k < n && parts.length < MAXP; k++){
    const a = Math.random() * 6.283, v = cell * rnd(speed * .4, speed);
    parts.push({k:'spark', x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:rnd(.25, .5), max:.5, c:color});

}
function debris(x, y, n, color, big){

    parts.push({k:'deb', x:x + rnd(-.3, .3) * cell, y:y + rnd(-.3, .3) * cell, vx:rnd(-4, 4) * cell * (big ? 1.6 : 1), vy:rnd(-5.5, 1) * cell * (big ? 1.6 : 1),
      life:rnd(.45, .85) * (big ? 1.5 : 1), max:1.3, c:color, s:cell * rnd(.08, .18) * (big ? 2 : 1), r:Math.random() * 6, vr:rnd(-12, 12)});

    const [x0, y0] = pts[k - 1], [x1, y1] = pts[k], dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;

}
const stageGlow = () => STAGES[save.stage].glow;

fx.boom = e => {

/* ---- レイアウト ---- */
let dpr = 1;
function resize(){
  const r = stageEl.getBoundingClientRect(); if (!r.width || !r.height) return;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const keepBoss = boss ? {hp:boss.hp, max:boss.max} : save.boss;
  layout(r.width, r.height); boss = null; save.boss = keepBoss; lucky = null; buildGrid();
}
function makeCracks(){
  const out = [];
  for (let i = 0; i < 6; i++){
    let x = rnd(.2, .8), y = rnd(.2, .8), a = Math.random() * 6.28; const pts = [[x, y]];
    for (let j = 0; j < 3; j++){ a += rnd(-.7, .7); x = Math.max(.06, Math.min(.94, x + Math.cos(a) * .22)); y = Math.max(.06, Math.min(.94, y + Math.sin(a) * .22)); pts.push([x, y]); }
    out.push(pts);
  }
  return out;
}

/* ---- 描画 ---- */
function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
function drawBlock(b, i){
  const s = easeOut(b.spawn), gap = Math.max(2, cell * .06), size = (cell - gap * 2) * s; if (size < 1) return;
  const x = offX + (i % cols) * cell + cell / 2 - size / 2, y = offY + (Math.floor(i / cols) - b.fy) * cell + cell / 2 - size / 2, rad = size * .16;
  ctx.fillStyle = blockColor(b); rr(x, y, size, size, rad); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.22)'; rr(x + size * .06, y + size * .72, size * .88, size * .22, size * .08); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(x + size * .09, y + size * .08, size * .82, size * .18, size * .08); ctx.fill();
  if (b.type === 'hard'){
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = size * .06; rr(x + size * .17, y + size * .34, size * .66, size * .34, size * .05); ctx.stroke();
  } else if (b.type === 'bomb'){
    ctx.fillStyle = '#2a0f16'; ctx.beginPath(); ctx.arc(x + size / 2, y + size * .56, size * .22, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#2a0f16'; ctx.lineWidth = size * .06; ctx.beginPath(); ctx.moveTo(x + size * .62, y + size * .38); ctx.lineTo(x + size * .74, y + size * .22); ctx.stroke();
    ctx.fillStyle = Math.random() < .5 ? '#ffd23f' : '#ff8a1f'; ctx.beginPath(); ctx.arc(x + size * .76, y + size * .2, size * (.06 + Math.random() * .04), 0, 6.283); ctx.fill();
  } else if (b.type === 'gold'){
    ctx.save(); rr(x, y, size, size, rad); ctx.clip();
    const sh = ((clock * .8 + i * .13) % 1.6) - .3;
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath();
    ctx.moveTo(x + size * (sh - .15), y + size); ctx.lineTo(x + size * (sh + .1), y + size); ctx.lineTo(x + size * (sh + .5), y); ctx.lineTo(x + size * (sh + .25), y); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const n = Math.ceil((1 - b.hp / b.max) * 6);
  if (n > 0){
    if (!b.cracks) b.cracks = makeCracks();
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = Math.max(1, size * .035); ctx.beginPath();
    for (let k = 0; k < n; k++){ const p = b.cracks[k]; ctx.moveTo(x + p[0][0] * size, y + p[0][1] * size); for (let j = 1; j < p.length; j++) ctx.lineTo(x + p[j][0] * size, y + p[j][1] * size); }
    ctx.stroke();
  }
  if (b.flash > 0){ ctx.fillStyle = `rgba(255,255,255,${b.flash * .6})`; rr(x, y, size, size, rad); ctx.fill(); }
}
let bossCracks = null;
function drawBoss(){
  const st = STAGES[save.stage], s = easeOut(boss.spawn), size = (cell * 2 - cell * .14) * s;
  const x = bossX() - size / 2, y = bossY() - size / 2, rad = size * .14;
  ctx.save();
  ctx.shadowColor = '#ff4c88'; ctx.shadowBlur = cell * (.4 + .2 * Math.sin(clock * 6));
  ctx.fillStyle = st.dark; rr(x, y, size, size, rad); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,.2)'; rr(x + size * .08, y + size * .07, size * .84, size * .16, size * .06); ctx.fill();
  ctx.fillStyle = st.color; ctx.globalAlpha = .35; rr(x + size * .25, y + size * .3, size * .5, size * .5, size * .1); ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = '#ff4c88'; ctx.lineWidth = Math.max(2, size * .025); rr(x, y, size, size, rad); ctx.stroke();
  const n = Math.ceil((1 - boss.hp / boss.max) * 6);
  if (n > 0){
    if (!bossCracks) bossCracks = makeCracks();
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(1.5, size * .03); ctx.beginPath();
    for (let k = 0; k < n; k++){ const p = bossCracks[k]; ctx.moveTo(x + p[0][0] * size, y + p[0][1] * size); for (let j = 1; j < p.length; j++) ctx.lineTo(x + p[j][0] * size, y + p[j][1] * size); }
    ctx.stroke();

  ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.fillStyle = '#ff4c88'; rr(bx, by, Math.max(bh, bw * Math.max(0, boss.hp / boss.max)), bh, bh / 2); ctx.fill();
  ctx.font = `${cell * .22}px "Dela Gothic One","Hiragino Sans",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  const label = (save.stage === STAGES.length - 1 ? '宇宙の核' : st.name + 'の塊') + '　' + fmt(Math.max(0, boss.hp));
  ctx.lineWidth = cell * .05; ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.strokeText(label, bossX(), by - 2);
  ctx.fillStyle = '#fff'; ctx.fillText(label, bossX(), by - 2);
  ctx.restore();

function drawLucky(){

function drawDrones(){
  const nd = stat.drones(), st = STAGES[save.stage];
  for (let k = 0; k < nd; k++){
    const d = drones[k], y = d.y + Math.sin(d.ph * 1.7) * cell * .06, s = cell * .3;

    ctx.fillStyle = '#2a3340'; ctx.beginPath(); ctx.moveTo(-s * .8, -s * .25); ctx.lineTo(s * .8, -s * .25); ctx.lineTo(s * .55, s * .35); ctx.lineTo(-s * .55, s * .35); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5a6778'; ctx.fillRect(-s * 1.1, -s * .32, s * .4, s * .1); ctx.fillRect(s * .7, -s * .32, s * .4, s * .1);
    ctx.fillStyle = st.glow; ctx.shadowColor = st.glow; ctx.shadowBlur = cell * .25;

function render(){
  const st = STAGES[save.stage];
  ctx.save();
  ctx.fillStyle = st.bg; ctx.fillRect(0, 0, W, H);
  if (fever > 0){ ctx.globalAlpha = .22 + .08 * Math.sin(clock * 12); ctx.fillStyle = `hsl(${(clock * 220) % 360},90%,45%)`; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (buffs.frenzy > 0){ ctx.globalAlpha = .1 + .05 * Math.sin(clock * 8); ctx.fillStyle = '#ffd84d'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (boss){ ctx.globalAlpha = .12 + .06 * Math.sin(clock * 4); ctx.fillStyle = '#ff4c88'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let c = 0; c <= cols; c++){ ctx.moveTo(offX + c * cell, offY); ctx.lineTo(offX + c * cell, H); }
  for (let r = 0; r <= rows; r++){ ctx.moveTo(0, offY + r * cell); ctx.lineTo(W, offY + r * cell); }
  ctx.stroke();

  if (!reduceMotion){
    const z = 1 + zoom; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
    if (shake > .3) ctx.translate(rnd(-.5, .5) * shake, rnd(-.5, .5) * shake);

  const g = cell * 14;

    if (p.k === 'deb'){ p.vy += g * dt; p.r += p.vr * dt; }
    else if (p.k === 'flame'){ p.vy -= cell * 3 * dt; }
    else { p.vx *= Math.pow(.02, dt); p.vy *= Math.pow(.02, dt); }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let k = floats.length - 1; k >= 0; k--){ const f = floats[k]; f.y += f.vy * dt; f.life -= dt; if (f.life <= 0) floats.splice(k, 1); }
  for (let k = rings.length - 1; k >= 0; k--){ rings[k].life -= dt; if (rings[k].life <= 0) rings.splice(k, 1); }
  for (let k = bolts.length - 1; k >= 0; k--){ bolts[k].life -= dt; if (bolts[k].life <= 0) bolts.splice(k, 1); }
  for (let k = flashes.length - 1; k >= 0; k--){ flashes[k].life -= dt; if (flashes[k].life <= 0) flashes.splice(k, 1); }
  for (let i = 0; i < blocks.length; i++){
    const b = blocks[i];
    if (b.alive && b.burn > 0 && parts.length < MAXP && Math.random() < dt * 14){
      parts.push({k:'flame', x:cx(i) + rnd(-.35, .35) * cell, y:cy(i) + rnd(-.1, .35) * cell, vx:rnd(-.3, .3) * cell, vy:-cell * rnd(.6, 1.4),

    }

  shake *= Math.pow(.0006, dt);

}

      h += `<li><button class="item btn ${can ? 'can' : ''}" data-perm="${p.id}" aria-disabled="${!can}">
        <span class="name">${p.name}<span class="lv">Lv ${l}</span></span>
        <span class="val">${mx ? p.v(l) + '（最大）' : `${p.v(l)} → ${p.v(l + 1)}`}</span>
        <span class="note">${p.note}</span><span class="cost dust" data-cid="perm:${p.id}">${mx ? '最大' : '✦ ' + c}</span></button></li>`;
    }
    h += '</ul>';
  }
  return h;
}
function renderSheet(keepScroll){
  const sc = keepScroll ? sheetBody.scrollTop : 0;
  renderTabs(); sheetBody.innerHTML = sheetHtml(); sheetBody.scrollTop = sc;
}
let sheetSig = '';
function refreshSheet(){
  if (sheet.hidden) return;
  // 特殊強化の出現やレベル変化でリストの形が変わるなら描き直す
  const sig = tab + ':' + SPECIALS.filter(s => s.cat === tab && !SP(s.id) && s.req()).map(s => s.id).join(',') + (tab === 'ach' ? achCount() : '');
  if (sig !== sheetSig){ sheetSig = sig; renderSheet(true); return; }
  sheetBody.querySelectorAll('[data-cid]').forEach(e => {
    const [kind, id] = e.dataset.cid.split(':'); let c, have = save.coins;
    if (kind === 'up'){
      const u = UPG.find(x => x.id === id), l = L(u.id); if (l >= u.max) return;
      const n = buyN(u); c = upCostN(u, n);
      // ×MAX は個数が変わるので、ボタンを作り直さずに表示だけ書き換える
      if (save.buyMode === 'max'){
        const txt = cs(c) + (n > 1 ? `<small>×${n}</small>` : '');
        if (e.innerHTML !== txt){ e.innerHTML = txt; const v = e.closest('.item').querySelector('.val'); if (v) v.textContent = `${u.v(l)} → ${u.v(l + n)}`; }
      }
    }
    else if (kind === 'mod') c = modCost(MODS.find(m => m.id === id));
    else if (kind === 'sp') c = spCost(SPECIALS.find(s => s.id === id));
    else if (kind === 'perm'){ c = permCost(PERM.find(p => p.id === id)); have = save.dust; }
    else c = slotCost();
    const can = have >= c;
    if (kind === 'slot'){ e.disabled = !can; return; }
    const target = (kind === 'up' || kind === 'sp' || kind === 'perm') ? e.closest('.item') : e;
    target.classList.toggle('can', can); target.setAttribute('aria-disabled', String(!can));
  });
  tabsEl.querySelectorAll('.tab').forEach(t => { const k = t.dataset.tab, want = k !== tab && anyAffordable(k); const has = !!t.querySelector('.dot'); if (want && !has) t.insertAdjacentHTML('beforeend', '<span class="dot"></span>'); else if (!want && has) t.querySelector('.dot').remove(); });
}
function openSheet(){ sheet.hidden = false; sheetSig = ''; renderSheet(false); stopHold(); }
function closeSheet(){ sheet.hidden = true; }
el('shopBtn').addEventListener('click', () => { initAudio(); sheet.hidden ? openSheet() : closeSheet(); });
el('closeSheet').addEventListener('click', closeSheet);
sheet.addEventListener('click', e => {
  initAudio();
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  const buy = (c, f) => { if (save.coins >= c){ save.coins -= c; f(); persist(); sfxBuy(); sheetSig = ''; renderSheet(true); } };
  if (d.tab){ tab = d.tab; sheetSig = ''; renderSheet(false); return; }
  if (d.mode){ save.buyMode = d.mode === 'max' ? 'max' : +d.mode; persist(); sheetSig = ''; renderSheet(true); return; }
  if (d.up){ const u = UPG.find(x => x.id === d.up); const n = buyN(u); if (n > 0) buy(upCostN(u, n), () => save.lv[u.id] = L(u.id) + n); return; }
  if (d.sp){ const s = SPECIALS.find(x => x.id === d.sp); if (!SP(s.id) && s.req()) buy(spCost(s), () => { save.sp[s.id] = 1; showToast(s.name, s.note); }); return; }
  if (d.mod){ const m = MODS.find(x => x.id === d.mod); if (ML(m.id) < m.max) buy(modCost(m), () => { const was = ML(m.id); save.mods[m.id] = was + 1; if (!was && save.equip.length < save.slots) save.equip.push(m.id); }); return; }
  if (d.eq){ const i = save.equip.indexOf(d.eq); if (i >= 0) save.equip.splice(i, 1); else if (save.equip.length < save.slots) save.equip.push(d.eq); persist(); renderSheet(true); return; }
  if (d.perm){ const p = PERM.find(x => x.id === d.perm); const c = permCost(p); if (P(p.id) < p.max && save.dust >= c){ save.dust -= c; save.perm[p.id] = P(p.id) + 1; persist(); sfxBuy(); updateStageLabel(); renderSheet(true); } return; }
  if (d.act === 'slot'){ if (save.slots < 4) buy(slotCost(), () => save.slots++); return; }
  if (d.act === 'prestige'){ if (save.stage >= PRESTIGE_STAGE && dustGain() > 0){ closeSheet(); showPrestige(); } return; }
  if (d.act === 'reset'){
    if (t.classList.contains('armed')){
      save = JSON.parse(JSON.stringify(DEFAULT)); persist(); boss = null; lucky = null; tab = 'idle';
      for (const k in buffs) buffs[k] = 0; combo = 0; fever = 0; heat = 0;
      updateStageLabel(); updateProgLabel(); syncMute(); buildGrid(); closeSheet(); showTitle();
    } else { t.classList.add('armed'); t.textContent = 'もう一度押すと全データが消えます'; }
  }
});

/* ---- 全画面 ---- */
let welcomeGain = 0;
function showTitle(){
  state = 'title'; overlay.hidden = false;
  overlay.innerHTML = `<div class="panel center">
    <h1 class="big-title display">連鎖<span>破壊</span></h1>
    <p>ドローンが勝手にブロックを壊し続ける。タップすれば一気に加速。飛び散った破片がまわりを壊し、そこからまた破片が飛ぶ。</p>
    <p>目を離していても壊れ続ける。戻ってきたら、稼いだコインで放置と操作の両方を強くしよう。ときどき流れてくる<b>幸運ブロック</b>は見逃すな。</p>
    <button class="go" data-act="start">始める</button></div>`;
}
function showWelcome(gain, secs){
  state = 'welcome'; welcomeGain = gain; overlay.hidden = false;
  overlay.innerHTML = `<div class="panel center">
    <h1 class="display">おかえり！</h1>
    <p>留守の${fmtT(secs)}のあいだ、ドローンが壊し続けていた。</p>
    <div class="welcome-num display">+${fmt(gain)}</div>
    <button class="go" data-act="claim">受け取る</button></div>`;
}
function showEnding(){
  state = 'ending'; overlay.hidden = false; closeSheet();
  overlay.innerHTML = `<div class="panel center"><h1 class="display">宇宙の核、粉砕。</h1>
    <p>木箱から始めて、宇宙そのものを砕いた。最高コンボは${save.best.toLocaleString('ja-JP')}。</p>
    <p>ここで宇宙を砕けば <b style="color:var(--dust)">+${dustGain()}</b> 星屑。永続強化を買って、次の宇宙をもっと速く壊そう。</p>
    <button class="go" data-act="prestige">宇宙を砕く　✦ +${dustGain()}</button>
    <button class="go ghost" data-act="resume">このまま壊し続ける</button></div>`;
}
function showPrestige(){
  state = 'ending'; overlay.hidden = false;
  overlay.innerHTML = `<div class="panel center"><h1 class="display">宇宙を砕く？</h1>
    <p>強化・モジュール${P('pkeep') ? '（Lvは残る）' : ''}・特殊強化・コインがリセットされ、${STAGES[Math.min(P('pstage'), STAGES.length - 1)].name}からやり直しになる。実績と星屑と永続強化は残る。</p>
    <div class="dust-num display">✦ +${dustGain()}</div>
    <button class="go" data-act="prestige">砕く</button>
    <button class="go ghost" data-act="resume">やめておく</button></div>`;
}
function showNewUniverse(d){
  state = 'ending'; overlay.hidden = false;
  overlay.innerHTML = `<div class="panel center"><h1 class="display">新しい宇宙</h1>
    <div class="dust-num display">✦ ${save.dust}</div>
    <p>星屑を${d}個手に入れた。強化パネルの「砕く」タブで永続強化が買える。</p>
    <p>${save.runs}回目の宇宙。今度はもっと速く、もっと派手に。</p>
    <button class="go" data-act="resume">壊し始める</button></div>`;
}
overlay.addEventListener('click', e => {
  initAudio(); const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.act === 'start'){ save.started = true; persist(); overlay.hidden = true; state = 'play'; }
  else if (t.dataset.act === 'claim'){ earn(welcomeGain); welcomeGain = 0; save.st.offline++; persist(); sfxGold(); overlay.hidden = true; state = 'play'; }
  else if (t.dataset.act === 'resume'){ overlay.hidden = true; state = 'play'; }
  else if (t.dataset.act === 'prestige'){
    const d = prestige(); buildGrid(); updateStageLabel(); updateProgLabel(); persist();
    freeze = .2; shake += 30; flash = 1; zoom = .12; sfxJackpot(); sfxBoom(true);
    showNewUniverse(d);
  }
});

/* ---- 放置・オフライン ---- */
function offline(secsRaw){
  const secs = Math.min((8 + 4 * P('poff')) * 3600, secsRaw);
  if (secs > 60 && save.idleRate > 0){ showWelcome(save.idleRate * secs * .5, secs); return true; }
  return false;
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ persist(); hiddenAt = Date.now(); stopHold(); }
  else { last = performance.now(); if (hiddenAt && state === 'play') offline((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
});

/* ---- ループ ---- */
let last = performance.now(), saveT = 0, refT = 0, achT = 0;
function frame(now){
  const raw = Math.min(.05, (now - last) / 1000); last = now; clock += raw;
  const dt = slow > 0 ? raw * .3 : raw;
  if (freeze > 0) freeze -= raw; else { step(dt); updateFx(dt); }
  tickT += raw;
  if (tickT >= 1){
    const rate = earnedTick / tickT; earnedTick = 0; tickT = 0;
    dispRate = dispRate ? dispRate * .7 + rate * .3 : rate;
    if (state === 'play' && lastTap > 8) save.idleRate = save.idleRate ? save.idleRate * .9 + rate * .1 : rate;
  }
  render(); hud(raw); tickNews(raw);
  achT += raw; if (achT > 1){ achT = 0; if (state === 'play') checkAch(); }
  refT += raw; if (refT > .4){ refT = 0; refreshSheet(); shopDot.hidden = !(sheet.hidden && TABS.some(([k]) => anyAffordable(k))); }
  saveT += raw; if (saveT > 5){ saveT = 0; persist(); }
  requestAnimationFrame(frame);
}
load();
new ResizeObserver(() => resize()).observe(stageEl);
resize(); updateStageLabel(); updateProgLabel(); syncMute();
if (!save.started) showTitle();
else { state = 'play'; if (save.t) offline((Date.now() - save.t) / 1000); }
requestAnimationFrame(frame);

})();
</script>
</body>
