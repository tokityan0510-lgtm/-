<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>連鎖破壊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e3e8ef; --surface:#f6f8fb; --ink:#1a2130; --muted:#5a6577; --line:#c4cdd9;
  --accent:#e0215f; --accent-deep:#a3123f; --coin:#a86f00; --coin-bg:#f6b400;
  --scrim:rgba(227,232,239,.9); --on-accent:#ffffff; --good:#0f8a5f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161f; --surface:#1a2330; --ink:#edf1f6; --muted:#93a0b3; --line:#2b3645;
    --accent:#ff4c88; --accent-deep:#b21b50; --coin:#ffc53a; --coin-bg:#ffc53a;
    --scrim:rgba(16,22,31,.92); --on-accent:#ffffff; --good:#3ddc97;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161f; --surface:#1a2330; --ink:#edf1f6; --muted:#93a0b3; --line:#2b3645;
  --accent:#ff4c88; --accent-deep:#b21b50; --coin:#ffc53a; --coin-bg:#ffc53a;
  --scrim:rgba(16,22,31,.92); --on-accent:#ffffff; --good:#3ddc97;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-weight:500;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
.display{font-family:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-weight:400}
button{font:inherit;color:inherit}

/* HUD */
.hud{padding:8px 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.purse{min-width:0;line-height:1}
.coins{display:flex;align-items:baseline;gap:6px}
#coins{font-size:clamp(28px,8.6vw,44px);color:var(--coin);white-space:nowrap;font-variant-numeric:tabular-nums}
.coins small{font-size:12px;color:var(--muted);font-weight:700}
#prod{display:block;margin-top:4px;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
#prod b{color:var(--good)}
.hud-side{display:flex;align-items:center;gap:8px;flex-shrink:0}
#stageName{font-size:14px;padding:5px 10px;border-radius:8px;background:var(--surface);border:1.5px solid var(--line);white-space:nowrap}
#stageSwatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;cursor:pointer;display:grid;place-items:center;padding:0}

/* Arena */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#0b0f15}
#cv{display:block;touch-action:none;cursor:crosshair}
.chain{position:absolute;left:0;right:0;top:10px;text-align:center;pointer-events:none;opacity:0;line-height:1;color:#fff}
#chainNum{font-size:clamp(44px,14vw,80px);display:inline-block;transform-origin:50% 60%;
  text-shadow:0 0 18px currentColor,0 3px 0 #000,0 -2px 0 #000,3px 0 0 #000,-3px 0 0 #000}
#chainLabel{font-size:18px;margin-left:4px;text-shadow:0 2px 0 #000,0 0 10px currentColor}
#chainMult{display:block;margin-top:4px;font-size:15px;font-weight:700;color:#ffd84d;text-shadow:0 2px 0 #000}
#fever{position:absolute;left:0;right:0;top:44%;text-align:center;pointer-events:none;opacity:0;transform:translateY(-50%)}
#fever span{font-size:clamp(40px,13vw,76px);color:#fff;display:inline-block;
  text-shadow:0 0 20px #ff4c88,0 0 40px #ffd84d,0 4px 0 #000;animation:pulse .5s ease-in-out infinite alternate}
#fever small{display:block;font-size:14px;color:#fff;font-weight:700;margin-top:6px;text-shadow:0 2px 0 #000}
@keyframes pulse{from{transform:scale(1) rotate(-3deg);filter:hue-rotate(0)}to{transform:scale(1.08) rotate(3deg);filter:hue-rotate(160deg)}}

/* Bottom bar */
.bar{padding:6px 14px 10px}
.gauge{height:5px;border-radius:3px;background:var(--surface);overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}
#feverFill{height:100%;width:0;background:linear-gradient(90deg,#ff4c88,#ffd84d,#3ddc97,#4cc9ff,#b48cff)}
.row{display:flex;align-items:center;gap:12px}
.stat{white-space:nowrap;font-size:13px;color:var(--muted);font-weight:700}
.stat b{font-family:"Dela Gothic One",system-ui,sans-serif;font-weight:400;font-size:20px;color:var(--ink);margin-left:4px}
.timer{flex:1;height:12px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line);overflow:hidden}
#timeFill{height:100%;width:100%;background:var(--accent);transform-origin:left center}
#timeText{min-width:50px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}

/* Overlay */
.overlay{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;color:var(--ink)}
.overlay[hidden]{display:none}
.panel{width:100%;max-width:540px;margin:0 auto;padding:16px 16px 8px;flex:1}
.center{display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:100%}
.big-title{margin:0;font-size:clamp(72px,24vw,132px);line-height:.92;letter-spacing:-.02em;color:var(--accent)}
.big-title span{display:block;color:var(--ink);transform:translateX(.5em)}
.center p{margin:0;max-width:32em;line-height:1.75;font-size:15px}
.center h1.display{margin:0;font-size:clamp(44px,14vw,80px);line-height:1.05;color:var(--accent)}
.welcome-num{font-size:clamp(36px,11vw,60px);color:var(--coin);line-height:1.1}

.result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 4px}
.result div{min-width:0}
.result dt{font-size:12px;color:var(--muted);font-weight:700}
.result dd{margin:4px 0 0;font-size:clamp(17px,5.6vw,26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .earn dd{color:var(--coin)}
.result .best dd{color:var(--accent)}

.next{margin-top:12px;padding:12px 14px;border-radius:14px;border:2px dashed var(--accent);display:grid;grid-template-columns:auto 1fr;gap:3px 12px;align-items:center}
.next .sw{width:42px;height:42px;border-radius:10px;grid-row:1 / span 2;box-shadow:inset 0 8px 0 rgba(255,255,255,.25)}
.next b{font-size:16px}
.next p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.next button{grid-column:1 / -1;margin-top:8px}
.next.done{border-style:solid;border-color:var(--line)}

.tabs{position:sticky;top:-16px;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:16px -16px 0;padding:10px 16px 8px;background:var(--scrim)}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;font-weight:700;font-size:14px;cursor:pointer;position:relative}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:10px 0 6px;line-height:1.6}

.list{list-style:none;margin:6px 0 0;padding:0;border-top:1.5px solid var(--line)}
.list li{border-bottom:1.5px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:11px 2px;align-items:center}
.item.btn{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:11px 2px;align-items:center;cursor:pointer}
.name{font-weight:700;font-size:15px}
.name .lv{font-size:12px;color:var(--muted);margin-left:6px}
.val{font-size:13px;font-weight:700;color:var(--accent)}
.note{grid-column:1 / -1;font-size:12px;color:var(--muted);line-height:1.5}
.cost{grid-column:2;grid-row:1 / span 2;justify-self:end;font-family:"Dela Gothic One",system-ui,sans-serif;font-size:14px;
  padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap;background:none;cursor:pointer}
.can .cost,.cost.can{background:var(--coin-bg);border-color:var(--coin-bg);color:#1a1200}
.item.btn[aria-disabled="true"]{cursor:default}
.item.btn[aria-disabled="true"] .name,.item.btn[aria-disabled="true"] .val{opacity:.6}
.acts{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.eq{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.eq.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.eq:disabled{opacity:.45;cursor:default}
.locked .name{color:var(--muted)}
.slots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.slot{flex:1;min-width:64px;padding:10px 6px;border-radius:10px;border:2px solid var(--accent);text-align:center;font-weight:700;font-size:14px}
.slot.empty{border-style:dashed;border-color:var(--line);color:var(--muted)}
.slot.lockd{border-style:dashed;border-color:var(--line);color:var(--muted);font-size:12px}
.toggle{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.toggle.on{background:var(--good);border-color:var(--good);color:#fff}

.go,.buy{appearance:none;border:0;cursor:pointer;width:100%;border-radius:999px;
  font-family:"Dela Gothic One",system-ui,sans-serif;font-size:20px;padding:15px 20px;
  background:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s}
.go:active,.buy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.buy{font-size:15px;padding:10px 16px}
.buy:disabled{background:var(--surface);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default}
.dock{position:sticky;bottom:0;padding:10px 16px 14px;background:var(--scrim);z-index:2}
.dock .go{display:block;max-width:508px;margin:0 auto}
.small{appearance:none;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:18px 0 4px;cursor:pointer}
.small.armed{color:var(--accent);font-weight:700}
.go:focus-visible,.buy:focus-visible,.item.btn:focus-visible,.cost:focus-visible,.eq:focus-visible,.tab:focus-visible,.toggle:focus-visible,.icon-btn:focus-visible,.small:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;height:72%;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.25);color:var(--ink)}
.sheet[hidden]{display:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.sheet-head .tabs{flex:1;margin:0;padding:0;position:static;background:none;grid-template-columns:repeat(4,1fr)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 24px}
.close{flex-shrink:0}
.prog{flex:1;min-width:0}
.prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.prog-label span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
.prog-bar{height:12px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line);overflow:hidden}
#progFill{height:100%;width:0;background:var(--accent);transition:width .2s}
#progFill.boss{background:linear-gradient(90deg,#ff4c88,#ff8a1f)}
.shop-btn{position:relative;appearance:none;border:0;cursor:pointer;border-radius:999px;padding:12px 22px;font-size:17px;
  background:var(--ink);color:var(--bg);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.shop-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.shop-btn .dot{position:absolute;top:6px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.shop-btn .dot[hidden]{display:none}
.section-title{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 2px}
#bossbar{position:absolute;left:12px;right:12px;top:0;pointer-events:none}

@media (prefers-reduced-motion: reduce){#fever span{animation:none}.go,.buy{transition:none}}
</style>
</head>
<body>
<header class="hud">
  <div class="purse">
    <div class="coins"><span id="coins" class="display">0</span><small>コイン</small></div>
    <span id="prod"></span>
  </div>
  <div class="hud-side">
    <span id="stageName"><span id="stageSwatch"></span><span id="stageText"></span></span>
    <button id="mute" class="icon-btn" aria-label="音を消す">🔊</button>
  </div>
</header>
<main id="stage">
  <canvas id="cv" aria-label="ブロックのフィールド。タップで壊す"></canvas>
  <div class="chain" id="chain"><span id="chainNum" class="display">0</span><span id="chainLabel" class="display">コンボ</span><span id="chainMult"></span></div>
  <div id="fever"><span class="display">フィーバー！</span><small>報酬3倍・威力2倍・連射2倍</small></div>
  <div class="overlay" id="overlay" hidden></div>
  <section class="sheet" id="sheet" hidden aria-label="強化">
    <div class="sheet-head">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="icon-btn close" id="closeSheet" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</main>
<footer class="bar">
  <div class="gauge" title="フィーバーゲージ"><div id="feverFill"></div></div>
  <div class="row">
    <div class="prog"><div class="prog-label"><span id="progText">次のボスまで</span><span id="progNum"></span></div><div class="prog-bar"><div id="progFill"></div></div></div>
    <button class="shop-btn display" id="shopBtn">強化<span class="dot" id="shopDot" hidden></span></button>
  </div>
</footer>
<script>
(() => {

const UNITS = ['', '万', '億', '兆', '京', '垓', '秭', '穣', '溝', '澗', '正', '載', '極', '恒河沙', '阿僧祇', '那由他', '不可思議', '無量大数'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 10000) return Math.floor(n).toLocaleString('ja-JP');
  const k = Math.floor(Math.log10(n) / 4);
  if (k >= UNITS.length) return n.toExponential(2).replace('e+', 'e');
  const v = n / Math.pow(10, 4 * k);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + UNITS[k];
}
const fmtX = x => x < 100 ? x.toFixed(x < 10 ? 2 : 1) : fmt(x);

const STAGES = [
  {name:'木箱', color:'#d08a45', dark:'#8a5726', glow:'#ffb36b', bg:'#1a1410'},
  {name:'石',   color:'#a3acb7', dark:'#636d79', glow:'#e4ecf5', bg:'#12161c'},
  {name:'鉄',   color:'#6f88a0', dark:'#3c4f63', glow:'#a9d4ff', bg:'#0d141d'},
  {name:'水晶', color:'#7fe0f0', dark:'#2f9db5', glow:'#c9fbff', bg:'#071a22'},
  {name:'溶岩', color:'#ff6a2b', dark:'#a3300f', glow:'#ffb15c', bg:'#1f0b06'},
  {name:'隕石', color:'#9a74b0', dark:'#563b6c', glow:'#e0b8ff', bg:'#130b1c'},
  {name:'星',   color:'#ffd84d', dark:'#c99a10', glow:'#fff3b0', bg:'#14110a'},
  {name:'銀河', color:'#b48cff', dark:'#6a43c4', glow:'#ffb3ff', bg:'#0c0820'},
];
const F_VAL = 1e5;
const sv = s => Math.pow(F_VAL, s);
const TUNE = {fhp:4000, fdmg:2000, gaugeBase:300, gaugeGrow:1.9, bossHp:1500, bossGrow:1.35, bossReward:300, comboDecay:.6};
const DEFAULT = {coins:0, stage:0, lv:{}, mods:{}, equip:[], slots:2, best:0, ended:false, muted:false, t:0, idleRate:0, prog:0, started:false, kills:0, boss:null};
let save = JSON.parse(JSON.stringify(DEFAULT));
const L = id => save.lv[id] || 0;
const ML = id => save.mods[id] || 0;
const M = id => save.equip.includes(id) ? ML(id) : 0;

const UPG = [
  // 放置
  {cat:'idle', id:'drones',   name:'ドローンの台数', note:'勝手に撃ち続けるドローン',           cost:800,   g:3.10,  max:11,  v:l => `${1+l}台`},
  {cat:'idle', id:'droneint', name:'連射速度',       note:'ドローンが撃つ間隔',                 cost:600,   g:2.40,  max:14,  v:l => `${(3*Math.pow(.85,l)).toFixed(2)}秒`},
  {cat:'idle', id:'dronedmg', name:'弾の威力',       note:'ドローンの弾が与えるダメージ',       cost:900,   g:2.30,  max:999, v:l => `×${fmtX(2*Math.pow(1.4,l))}`},
  {cat:'idle', id:'spawn',    name:'湧き速度',       note:'壊れたブロックが戻ってくる速さ',     cost:1200,  g:2.50,  max:15,  v:l => `${(8*Math.pow(.85,l)).toFixed(1)}秒`},
  {cat:'idle', id:'drburst',  name:'弾の炸裂',       note:'弾が当たったとき追加で飛ぶ破片',     cost:2500,  g:2.70,  max:10,  v:l => `+${l*2}個`},
  // 操作
  {cat:'tap',  id:'tapburst', name:'タップの破片',   note:'タップで壊したときの破片の倍率',     cost:500,   g:2.40,  max:20,  v:l => `×${2+l}`},
  {cat:'tap',  id:'heat',     name:'熱量',           note:'1タップで溜まるフィーバーゲージ',     cost:1500,  g:2.50,  max:12,  v:l => `+${8+2*l}`},
  {cat:'tap',  id:'fever',    name:'フィーバー',     note:'ゲージ満タンで報酬3倍・威力2倍になる時間', cost:4000, g:2.70, max:10, v:l => `${5+l}秒`},
  {cat:'tap',  id:'tapboom',  name:'衝撃波',         note:'タップした周りのブロックにもダメージ', cost:3000, g:2.80,  max:8,   v:l => l ? `半径${(1+.3*l).toFixed(1)}・威力×${l*2}` : 'なし'},
  // 共通
  {cat:'core', id:'shards',   name:'破片の数',       note:'ブロックが壊れたときに飛び散る破片', cost:1000,  g:2.50,  max:25,  v:l => `${3+l}個`},
  {cat:'core', id:'power',    name:'破片の威力',     note:'破片1つが与えるダメージ',             cost:1500,  g:2.40,  max:999, v:l => `×${fmtX(Math.pow(1.35,l))}`},
  {cat:'core', id:'chain',    name:'コンボ係数',     note:'コンボが高いほど報酬が増える',       cost:5000,  g:2.70,  max:99,  v:l => `${(0.1+0.1*l).toFixed(1)}`},
  {cat:'core', id:'crit',     name:'クリティカル',   note:'ダメージ4倍が出る確率',               cost:4000,  g:2.70,  max:15,  v:l => `${5+3*l}%`},
  {cat:'core', id:'bomb',     name:'爆弾ブロック',   note:'壊すと周りを吹き飛ばすブロックの出現率', cost:6000, g:2.70, max:15, v:l => `${(Math.min(.25,.02+.015*l)*100).toFixed(1)}%`},
  {cat:'core', id:'gold',     name:'金ブロック',     note:'価値15倍のブロックの出現率',           cost:8000,  g:2.70,  max:15,  v:l => `${Math.round(Math.min(.2,.01+.01*l)*100)}%`},
];
const MODS = [
  {id:'ricochet', name:'跳弾', note:'破片が画面の端で跳ね返り、跳ねるたびに威力が上がる', unlock:15000,  cost:12000, g:2.70, max:10, v:l => `${1+l}回・1回ごと+${25+5*(l-1)}%`},
  {id:'split',    name:'分裂', note:'ブロックに当たった破片がときどき2つに分かれる',     unlock:30000,  cost:20000, g:2.70, max:10, v:l => `${Math.round(Math.min(.8,.2+.07*(l-1))*100)}%`},

const sfxZap = () => { if (!actx) return; const n = actx.currentTime; if (n - lastZap < .06) return; lastZap = n; tone(1800, .08, 'sawtooth', .05, 0, .3); };
const sfxFever = () => { [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, .25, 'square', .07, k * .06, 1)); noise(.6, 3000, .2); };
const sfxBuy = () => tone(1200, .07, 'triangle', .1, 0, 1.4);

const sfxBoss = () => { tone(55, 1.2, 'sawtooth', .25, 0, .7); noise(.8, 400, .35); };

/* ---- エフェクト ---- */
let parts = [], floats = [], rings = [], bolts = [], flashes = [];
let freeze = 0, shake = 0, zoom = 0, flash = 0, clock = 0;
const MAXP = 1100;
const rnd = (a, b) => a + Math.random() * (b - a);
function sparks(x, y, n, color, speed = 8){
  for (let k = 0; k < n && parts.length < MAXP; k++){
    const a = Math.random() * 6.283, v = cell * rnd(speed * .4, speed);
    parts.push({k:'spark', x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:rnd(.25, .5), max:.5, c:color});
  }
}
function debris(x, y, n, color, big){
  for (let k = 0; k < n && parts.length < MAXP; k++){
    parts.push({k:'deb', x:x + rnd(-.3, .3) * cell, y:y + rnd(-.3, .3) * cell, vx:rnd(-4, 4) * cell * (big ? 1.6 : 1), vy:rnd(-5.5, 1) * cell * (big ? 1.6 : 1),
      life:rnd(.45, .85) * (big ? 1.5 : 1), max:1.3, c:color, s:cell * rnd(.08, .18) * (big ? 2 : 1), r:Math.random() * 6, vr:rnd(-12, 12)});
  }
}
function addFloat(f){ if (floats.length > 60) floats.shift(); floats.push(f); }
function jag(pts){
  const out = [pts[0]];
  for (let k = 1; k < pts.length; k++){
    const [x0, y0] = pts[k - 1], [x1, y1] = pts[k], dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
    for (let m = 1; m <= 3; m++){ const t = m / 4, o = rnd(-.22, .22) * cell; out.push([x0 + dx * t + nx * o, y0 + dy * t + ny * o]); }
    out.push(pts[k]);
  }
  return out;
}
const stageGlow = () => STAGES[save.stage].glow;
function blockColor(b){
  if (b.type === 'bomb') return '#e0263f';
  if (b.type === 'gold') return '#f6b400';
  const s = STAGES[save.stage];
  return b.type === 'hard' ? s.dark : s.color;
}

fx.tap = (x, y) => { rings.push({x, y, to:cell * 1.1, life:.28, max:.28, c:'#ffffff', w:.18}); shake += 2.5; sparks(x, y, 6, '#ffffff', 6); };
fx.hit = (i, d, crit) => {
  if (crit){
    if (floats.length < 50) addFloat({x:cx(i) + rnd(-.2, .2) * cell, y:cy(i) - cell * .1, t:fmt(d) + '!', life:.6, max:.6, c:'#ffe14d', size:cell * .36, vy:-cell * 1.8, pop:1});
    sparks(cx(i), cy(i), 4, '#ffe14d', 7); shake += .7;
  } else if (floats.length < 14 && Math.random() < .25){
    addFloat({x:cx(i) + rnd(-.25, .25) * cell, y:cy(i), t:fmt(d), life:.45, max:.45, c:'#ffffff', size:cell * .2, vy:-cell * 1.5});
  }
};
fx.brk = (i, b, gain) => {
  const x = cx(i), y = cy(i);
  debris(x, y, 5, blockColor(b));
  sparks(x, y, 4, b.type === 'gold' ? '#ffe14d' : stageGlow(), 7);
  if (b.type === 'gold'){
    addFloat({x, y, t:'+' + fmt(gain), life:1, max:1, c:'#ffd84d', size:cell * .46, vy:-cell * 1.1, pop:1});
    rings.push({x, y, to:cell * 1.4, life:.35, max:.35, c:'#ffd84d', w:.16}); sparks(x, y, 14, '#ffe14d', 10); shake += 4; sfxGold();
  } else {
    if (floats.length < 22) addFloat({x, y:y - cell * .2, t:'+' + fmt(gain), life:.7, max:.7, c:'#ffc53a', size:cell * .24, vy:-cell * 1.2});
    sfxPop(combo);
  }
  shake = Math.min(shake + .4, 16);
};
fx.boom = e => {
  rings.push({x:e.x, y:e.y, to:e.R * 1.2, life:.35, max:.35, c:e.quiet ? '#ffffff' : '#ff8a1f', w:.22});
  if (!e.quiet) flashes.push({x:e.x, y:e.y, r:e.R * 1.1, life:.18, max:.18});
  sparks(e.x, e.y, e.big ? 22 : 8, e.quiet ? '#ffffff' : '#ffb13b', 11);
  if (!e.quiet){ freeze = Math.max(freeze, e.big ? .05 : .02); shake += e.big ? 8 : 3; if (e.big) zoom = Math.max(zoom, .03); sfxBoom(e.big); }
};
fx.bolt = pts => { bolts.push({pts:jag(pts), life:.22, max:.22}); for (let k = 1; k < pts.length; k++) sparks(pts[k][0], pts[k][1], 3, '#bfe9ff', 8); shake += 1.5; sfxZap(); };
fx.split = (x, y) => { if (parts.length < MAXP - 50) sparks(x, y, 2, '#ffffff', 5); };
fx.fever = () => { flash = 1; freeze = Math.max(freeze, .12); shake += 14; zoom = .06; sfxFever(); };
fx.milestone = n => {
  freeze = Math.max(freeze, .06); shake += 10; zoom = Math.max(zoom, .04); flash = Math.max(flash, .3);
  addFloat({x:W / 2, y:H * .42, t:`${n.toLocaleString('ja-JP')}コンボ！`, life:1.2, max:1.2, c:'#ff4c88', size:Math.min(cell * .95, W / 6.5), vy:-cell * .4, pop:1, big:true});
  sfxChime();
};
fx.shoot = (d, tx, ty) => { d.fl = 1; sfxShot(); };
fx.spawn = i => {};
fx.bossSpawn = b => {
  shake += 16; zoom = .05; flash = .5; sfxBoss();
  addFloat({x:W / 2, y:H * .3, t:'ボス出現！', life:1.6, max:1.6, c:'#ff4c88', size:Math.min(cell * .9, W / 7), vy:-cell * .25, pop:1, big:true});
  rings.push({x:bossX(), y:bossY(), to:Math.max(W, H) * .8, life:.6, max:.6, c:'#ff4c88', w:.3});
  updateProgLabel();
};
fx.bossHit = (d, crit) => {
  if (!boss) return;
  if (floats.length < 50 && (crit || Math.random() < .2)) addFloat({x:bossX() + rnd(-.6, .6) * cell, y:bossY() - cell * .3, t:fmt(d) + (crit ? '!' : ''), life:.6, max:.6, c:crit ? '#ffe14d' : '#ffffff', size:cell * (crit ? .4 : .26), vy:-cell * 1.6, pop:crit ? 1 : 0});
  sparks(bossX() + rnd(-.8, .8) * cell, bossY() + rnd(-.8, .8) * cell, 2, '#ffffff', 6);
};
fx.bossDie = (b, gain, prevStage) => {
  const x = (cx(b.cells[0]) + cx(b.cells[1])) / 2, y = (cy(b.cells[0]) + cy(b.cells[2])) / 2;
  freeze = Math.max(freeze, .16); shake += 26; zoom = .1; flash = 1;
  debris(x, y, 40, STAGES[prevStage].dark, true); sparks(x, y, 60, '#ffffff', 16); sparks(x, y, 40, STAGES[prevStage].glow, 12);
  flashes.push({x, y, r:Math.max(W, H), life:.5, max:.5});
  rings.push({x, y, to:Math.max(W, H) * 1.2, life:.8, max:.8, c:'#ffffff', w:.5});
  addFloat({x:W / 2, y:H * .4, t:'撃破！', life:1.8, max:1.8, c:'#ffe14d', size:Math.min(cell * 1.2, W / 5), vy:-cell * .2, pop:1, big:true});
  addFloat({x:W / 2, y:H * .52, t:'+' + fmt(gain), life:1.8, max:1.8, c:'#ffd84d', size:Math.min(cell * .6, W / 9), vy:-cell * .2, pop:1, big:true});
  sfxBoom(true); sfxFever();
  setTimeout(() => { updateStageLabel(); updateProgLabel(); if (save.ended && !save.endSeen){ save.endSeen = true; persist(); showEnding(); } }, 900);
  persist();
};

/* ---- レイアウト ---- */
let dpr = 1;
function resize(){
  const r = stageEl.getBoundingClientRect(); if (!r.width || !r.height) return;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const keepBoss = boss ? {hp:boss.hp, max:boss.max} : save.boss;
  layout(r.width, r.height); boss = null; save.boss = keepBoss; buildGrid();
}
function makeCracks(){
  const out = [];
  for (let i = 0; i < 6; i++){
    let x = rnd(.2, .8), y = rnd(.2, .8), a = Math.random() * 6.28; const pts = [[x, y]];
    for (let j = 0; j < 3; j++){ a += rnd(-.7, .7); x = Math.max(.06, Math.min(.94, x + Math.cos(a) * .22)); y = Math.max(.06, Math.min(.94, y + Math.sin(a) * .22)); pts.push([x, y]); }
    out.push(pts);
  }
  return out;
}

/* ---- 描画 ---- */
function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
function drawBlock(b, i){
  const s = easeOut(b.spawn), gap = Math.max(2, cell * .06), size = (cell - gap * 2) * s; if (size < 1) return;
  const x = offX + (i % cols) * cell + cell / 2 - size / 2, y = offY + Math.floor(i / cols) * cell + cell / 2 - size / 2, rad = size * .16;
  ctx.fillStyle = blockColor(b); rr(x, y, size, size, rad); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.22)'; rr(x + size * .06, y + size * .72, size * .88, size * .22, size * .08); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(x + size * .09, y + size * .08, size * .82, size * .18, size * .08); ctx.fill();
  if (b.type === 'hard'){
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = size * .06; rr(x + size * .17, y + size * .34, size * .66, size * .34, size * .05); ctx.stroke();
  } else if (b.type === 'bomb'){
    ctx.fillStyle = '#2a0f16'; ctx.beginPath(); ctx.arc(x + size / 2, y + size * .56, size * .22, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#2a0f16'; ctx.lineWidth = size * .06; ctx.beginPath(); ctx.moveTo(x + size * .62, y + size * .38); ctx.lineTo(x + size * .74, y + size * .22); ctx.stroke();
    ctx.fillStyle = Math.random() < .5 ? '#ffd23f' : '#ff8a1f'; ctx.beginPath(); ctx.arc(x + size * .76, y + size * .2, size * (.06 + Math.random() * .04), 0, 6.283); ctx.fill();
  } else if (b.type === 'gold'){
    ctx.save(); rr(x, y, size, size, rad); ctx.clip();
    const sh = ((clock * .8 + i * .13) % 1.6) - .3;
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath();
    ctx.moveTo(x + size * (sh - .15), y + size); ctx.lineTo(x + size * (sh + .1), y + size); ctx.lineTo(x + size * (sh + .5), y); ctx.lineTo(x + size * (sh + .25), y); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const n = Math.ceil((1 - b.hp / b.max) * 6);
  if (n > 0){
    if (!b.cracks) b.cracks = makeCracks();
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = Math.max(1, size * .035); ctx.beginPath();
    for (let k = 0; k < n; k++){ const p = b.cracks[k]; ctx.moveTo(x + p[0][0] * size, y + p[0][1] * size); for (let j = 1; j < p.length; j++) ctx.lineTo(x + p[j][0] * size, y + p[j][1] * size); }
    ctx.stroke();
  }
  if (b.flash > 0){ ctx.fillStyle = `rgba(255,255,255,${b.flash * .6})`; rr(x, y, size, size, rad); ctx.fill(); }
}
let bossCracks = null;
function drawBoss(){
  const st = STAGES[save.stage], s = easeOut(boss.spawn), size = (cell * 2 - cell * .14) * s;
  const x = bossX() - size / 2, y = bossY() - size / 2, rad = size * .14;
  ctx.save();
  ctx.shadowColor = '#ff4c88'; ctx.shadowBlur = cell * (.4 + .2 * Math.sin(clock * 6));
  ctx.fillStyle = st.dark; rr(x, y, size, size, rad); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,.2)'; rr(x + size * .08, y + size * .07, size * .84, size * .16, size * .06); ctx.fill();
  ctx.fillStyle = st.color; ctx.globalAlpha = .35; rr(x + size * .25, y + size * .3, size * .5, size * .5, size * .1); ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = '#ff4c88'; ctx.lineWidth = Math.max(2, size * .025); rr(x, y, size, size, rad); ctx.stroke();
  const n = Math.ceil((1 - boss.hp / boss.max) * 6);
  if (n > 0){
    if (!bossCracks) bossCracks = makeCracks();
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(1.5, size * .03); ctx.beginPath();
    for (let k = 0; k < n; k++){ const p = bossCracks[k]; ctx.moveTo(x + p[0][0] * size, y + p[0][1] * size); for (let j = 1; j < p.length; j++) ctx.lineTo(x + p[j][0] * size, y + p[j][1] * size); }
    ctx.stroke();
  }
  if (boss.flash > 0){ ctx.fillStyle = `rgba(255,255,255,${boss.flash * .6})`; rr(x, y, size, size, rad); ctx.fill(); }
  const bw = size, bh = Math.max(6, cell * .14), bx = x, by = y - bh - cell * .12;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.fillStyle = '#ff4c88'; rr(bx, by, Math.max(bh, bw * Math.max(0, boss.hp / boss.max)), bh, bh / 2); ctx.fill();
  ctx.font = `${cell * .22}px "Dela Gothic One","Hiragino Sans",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.lineWidth = cell * .05; ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.strokeText(`${st.name}の塊　${fmt(Math.max(0, boss.hp))}`, bossX(), by - 2);
  ctx.fillStyle = '#fff'; ctx.fillText(`${st.name}の塊　${fmt(Math.max(0, boss.hp))}`, bossX(), by - 2);
  ctx.restore();
}
function drawDrones(){
  const nd = stat.drones(), st = STAGES[save.stage];
  for (let k = 0; k < nd; k++){
    const d = drones[k], y = d.y + Math.sin(d.ph * 1.7) * cell * .06, s = cell * .3;
    d.fl = Math.max(0, (d.fl || 0) - .08);
    ctx.save(); ctx.translate(d.x, y);
    ctx.fillStyle = '#2a3340'; ctx.beginPath(); ctx.moveTo(-s * .8, -s * .25); ctx.lineTo(s * .8, -s * .25); ctx.lineTo(s * .55, s * .35); ctx.lineTo(-s * .55, s * .35); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5a6778'; ctx.fillRect(-s * 1.1, -s * .32, s * .4, s * .1); ctx.fillRect(s * .7, -s * .32, s * .4, s * .1);
    ctx.fillStyle = st.glow; ctx.shadowColor = st.glow; ctx.shadowBlur = cell * .25;
    ctx.beginPath(); ctx.arc(0, s * .05, s * .18 + d.fl * s * .25, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}
function render(){
  const st = STAGES[save.stage];
  ctx.save();
  ctx.fillStyle = st.bg; ctx.fillRect(0, 0, W, H);
  if (fever > 0){ ctx.globalAlpha = .22 + .08 * Math.sin(clock * 12); ctx.fillStyle = `hsl(${(clock * 220) % 360},90%,45%)`; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (boss){ ctx.globalAlpha = .12 + .06 * Math.sin(clock * 4); ctx.fillStyle = '#ff4c88'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let c = 0; c <= cols; c++){ ctx.moveTo(offX + c * cell, offY); ctx.lineTo(offX + c * cell, H); }
  for (let r = 0; r <= rows; r++){ ctx.moveTo(0, offY + r * cell); ctx.lineTo(W, offY + r * cell); }
  ctx.stroke();

  if (!reduceMotion){
    const z = 1 + zoom; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
    if (shake > .3) ctx.translate(rnd(-.5, .5) * shake, rnd(-.5, .5) * shake);
  }
  drawDrones();
  for (let i = 0; i < blocks.length; i++) if (blocks[i].alive) drawBlock(blocks[i], i);
  if (boss) drawBoss();

  for (const p of parts){
    if (p.k !== 'deb') continue;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5)); ctx.fillStyle = p.c;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.restore();
  }
  ctx.globalAlpha = 1;

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < blocks.length; i++){
    const b = blocks[i]; if (!b.alive || b.burn <= 0) continue;
    ctx.globalAlpha = .35 + .2 * Math.sin(clock * 20 + i);
    ctx.fillStyle = '#ff5a14'; rr(offX + (i % cols) * cell + 1, offY + Math.floor(i / cols) * cell + 1, cell - 2, cell - 2, cell * .15); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of flashes){
    const a = f.life / f.max, grd = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    grd.addColorStop(0, `rgba(255,240,200,${a})`); grd.addColorStop(.5, `rgba(255,140,40,${a * .6})`); grd.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
  }
  if (bullets.length){
    ctx.strokeStyle = st.glow; ctx.lineCap = 'round';
    for (const pass of [0, 1]){
      ctx.globalAlpha = pass ? 1 : .3; ctx.lineWidth = pass ? Math.max(2, cell * .07) : cell * .22; ctx.beginPath();
      for (const u of bullets){ ctx.moveTo(u.x - u.vx * .03, u.y - u.vy * .03); ctx.lineTo(u.x, u.y); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (shards.length){
    ctx.lineCap = 'round';
    const buckets = fever > 0 ? 6 : 1;
    for (let bkt = 0; bkt < buckets; bkt++){
      const col = fever > 0 ? `hsl(${(clock * 300 + bkt * 60) % 360},100%,65%)` : st.glow;
      for (const pass of [0, 1]){
        ctx.strokeStyle = col; ctx.globalAlpha = pass ? 1 : .22; ctx.lineWidth = pass ? Math.max(1.5, cell * .05) : cell * .16; ctx.beginPath();
        for (let k = bkt; k < shards.length; k += buckets){ const o = shards[k], tl = pass ? .022 : .035; ctx.moveTo(o.x - o.vx * tl, o.y - o.vy * tl); ctx.lineTo(o.x, o.y); }
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  for (const p of parts){
    if (p.k === 'deb') continue;
    const a = Math.max(0, p.life / p.max); ctx.globalAlpha = a;
    if (p.k === 'flame'){ ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (.5 + a * .5), 0, 6.283); ctx.fill(); }
    else { ctx.strokeStyle = p.c; ctx.lineWidth = Math.max(1, cell * .035); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .03, p.y - p.vy * .03); ctx.stroke(); }
  }
  for (const g of rings){
    const t = 1 - g.life / g.max; ctx.globalAlpha = g.life / g.max; ctx.strokeStyle = g.c; ctx.lineWidth = cell * g.w * (1 - t) + 1;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.to * easeOut(t), 0, 6.283); ctx.stroke();
  }
  for (const bl of bolts){
    const a = bl.life / bl.max * (.6 + Math.random() * .4);
    for (const pass of [0, 1]){
      ctx.globalAlpha = pass ? a : a * .35; ctx.strokeStyle = pass ? '#ffffff' : '#6fd2ff'; ctx.lineWidth = pass ? 2 : cell * .2; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(bl.pts[0][0], bl.pts[0][1]); for (let k = 1; k < bl.pts.length; k++) ctx.lineTo(bl.pts[k][0], bl.pts[k][1]); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const f of floats){
    const a = Math.min(1, f.life / f.max * 2.2), pop = f.pop ? 1 + Math.max(0, (f.life / f.max - .75)) * 2 : 1;
    ctx.globalAlpha = a; const sz = f.size * pop;
    ctx.font = `${sz}px "Dela Gothic One","Hiragino Sans",sans-serif`;
    ctx.lineWidth = sz * .22; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(f.t, f.x, f.y);
    ctx.fillStyle = f.c; ctx.fillText(f.t, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash * .55})`; ctx.fillRect(0, 0, W, H); }
}
function updateFx(dt){
  const g = cell * 14;
  for (let k = parts.length - 1; k >= 0; k--){
    const p = parts[k]; p.life -= dt;
    if (p.life <= 0){ parts[k] = parts[parts.length - 1]; parts.pop(); continue; }
    if (p.k === 'deb'){ p.vy += g * dt; p.r += p.vr * dt; }
    else if (p.k === 'flame'){ p.vy -= cell * 3 * dt; }
    else { p.vx *= Math.pow(.02, dt); p.vy *= Math.pow(.02, dt); }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let k = floats.length - 1; k >= 0; k--){ const f = floats[k]; f.y += f.vy * dt; f.life -= dt; if (f.life <= 0) floats.splice(k, 1); }
  for (let k = rings.length - 1; k >= 0; k--){ rings[k].life -= dt; if (rings[k].life <= 0) rings.splice(k, 1); }
  for (let k = bolts.length - 1; k >= 0; k--){ bolts[k].life -= dt; if (bolts[k].life <= 0) bolts.splice(k, 1); }
  for (let k = flashes.length - 1; k >= 0; k--){ flashes[k].life -= dt; if (flashes[k].life <= 0) flashes.splice(k, 1); }
  for (let i = 0; i < blocks.length; i++){
    const b = blocks[i];
    if (b.alive && b.burn > 0 && parts.length < MAXP && Math.random() < dt * 14){
      parts.push({k:'flame', x:cx(i) + rnd(-.35, .35) * cell, y:cy(i) + rnd(-.1, .35) * cell, vx:rnd(-.3, .3) * cell, vy:-cell * rnd(.6, 1.4),
        life:rnd(.3, .55), max:.55, c:Math.random() < .5 ? '#ff7a1a' : '#ffcf3a', s:cell * rnd(.08, .15)});
    }
  }
  if (!boss) bossCracks = null;
  flash = Math.max(0, flash - dt * 3);
  zoom *= Math.pow(.004, dt);
  shake *= Math.pow(.0006, dt);
}

/* ---- HUD ---- */
const el = id => document.getElementById(id);
const coinsEl = el('coins'), prodEl = el('prod'), chainEl = el('chain'), chainNum = el('chainNum'), chainMult = el('chainMult'), feverEl = el('fever'), feverFill = el('feverFill');
const progFill = el('progFill'), progNum = el('progNum'), progText = el('progText'), shopDot = el('shopDot');
let shownCoins = '', shownProd = '', shownChain = -1, chainScale = 1, chainAlpha = 0, dispRate = 0, tickT = 0, tickEarn = 0;
const CHAIN_COLORS = [[0, '#ffffff'], [50, '#ffe14d'], [100, '#ff9a3c'], [250, '#ff4c88'], [500, '#c38bff'], [1000, '#4cc9ff']];
function hud(dt){
  const c = fmt(save.coins); if (c !== shownCoins){ coinsEl.textContent = c; shownCoins = c; }
  const ps = dispRate > 0 ? `毎秒 <b>+${fmt(dispRate)}</b>${lastTap > 8 ? '（放置中）' : ''}` : ''; if (ps !== shownProd){ prodEl.innerHTML = ps; shownProd = ps; }
  feverFill.style.width = (fever > 0 ? fever / stat.fever() * 100 : Math.min(100, heat)) + '%';
  feverEl.style.opacity = fever > 0 ? 1 : 0;
  if (boss){ progFill.classList.add('boss'); progFill.style.width = Math.max(0, boss.hp / boss.max * 100) + '%'; progNum.textContent = fmt(Math.max(0, boss.hp)); }
  else { progFill.classList.remove('boss'); progFill.style.width = Math.min(100, save.prog / gaugeNeed() * 100) + '%'; progNum.textContent = `${save.prog.toLocaleString('ja-JP')} / ${gaugeNeed().toLocaleString('ja-JP')}`; }
  const cm = Math.floor(combo);
  if (cm >= 5){
    if (cm !== shownChain){
      chainNum.textContent = cm.toLocaleString('ja-JP');
      let col = '#fff'; for (const [n, cc] of CHAIN_COLORS) if (cm >= n) col = cc;
      chainEl.style.color = col;
      chainMult.textContent = `報酬 ×${fmtX((1 + Math.sqrt(combo) * stat.chain()) * (fever > 0 ? 3 : 1))}`;
      if (cm > shownChain) chainScale = 1.2; shownChain = cm;
    }
    chainAlpha = 1;
  } else { chainAlpha = Math.max(0, chainAlpha - dt * 2.5); shownChain = -1; }
  chainScale += (1 - chainScale) * Math.min(1, dt * 14);
  chainEl.style.opacity = chainAlpha;
  chainNum.style.transform = reduceMotion ? '' : `scale(${chainScale})`;
}
function updateStageLabel(){ const s = STAGES[save.stage]; el('stageText').textContent = '素材：' + s.name; el('stageSwatch').style.background = s.color; }
function updateProgLabel(){ progText.textContent = boss ? 'ボス戦中' : save.ended ? '次のボスまで（再戦）' : '次のボスまで'; }
const muteBtn = el('mute');
function syncMute(){ muteBtn.textContent = save.muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-label', save.muted ? '音を出す' : '音を消す'); }
muteBtn.addEventListener('click', () => { save.muted = !save.muted; syncMute(); persist(); initAudio(); });

let holdTimer = null, holdX = 0, holdY = 0;
function tapAt(clientX, clientY){ const r = cv.getBoundingClientRect(); holdX = clientX - r.left; holdY = clientY - r.top; tap(holdX, holdY); }
cv.addEventListener('pointerdown', e => {
  initAudio(); if (!sheet.hidden) return;
  tapAt(e.clientX, e.clientY);
  clearInterval(holdTimer); holdTimer = setInterval(() => tap(holdX, holdY), 170);
});
cv.addEventListener('pointermove', e => { if (holdTimer){ const r = cv.getBoundingClientRect(); holdX = e.clientX - r.left; holdY = e.clientY - r.top; } });
const stopHold = () => { clearInterval(holdTimer); holdTimer = null; };
cv.addEventListener('pointerup', stopHold); cv.addEventListener('pointercancel', stopHold); cv.addEventListener('pointerleave', stopHold);

/* ---- シート（強化） ---- */
let tab = 'idle';
const TABS = [['idle', '放置'], ['tap', '操作'], ['core', '共通'], ['build', 'ビルド']];
const cs = n => fmt(n);
function anyAffordable(kind){
  if (kind === 'build') return MODS.some(m => ML(m.id) < m.max && save.coins >= modCost(m)) || (save.slots < 4 && save.coins >= slotCost());
  return UPG.some(u => u.cat === kind && L(u.id) < u.max && save.coins >= upCost(u));
}
function renderTabs(){
  tabsEl.innerHTML = TABS.map(([k, n]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab === k}">${n}${tab !== k && anyAffordable(k) ? '<span class="dot"></span>' : ''}</button>`).join('');
}
const HINTS = {idle:'ドローンは目を離していても撃ち続ける。放置の稼ぎはここで伸びる。', tap:'タップは加速役。叩くほどフィーバーゲージが溜まり、満タンで全部が速くなる。長押しで連打できる。', core:'ドローンにもタップにも効く土台の強化。', build:'モジュールは装備枠に入れたものだけが効く。組み合わせでビルドが決まる。'};
function sheetHtml(){
  let h = `<p class="hint">${HINTS[tab]}</p>`;
  if (tab !== 'build'){
    h += '<ul class="list">';
    for (const u of UPG){
      if (u.cat !== tab) continue;
      const l = L(u.id), mx = l >= u.max, c = upCost(u), can = !mx && save.coins >= c;
      h += `<li><button class="item btn ${can ? 'can' : ''}" data-up="${u.id}" aria-disabled="${!can}">
        <span class="name">${u.name}<span class="lv">Lv ${l}</span></span>
        <span class="val">${mx ? u.v(l) + '（最大）' : `${u.v(l)} → ${u.v(l + 1)}`}</span>
        <span class="note">${u.note}</span><span class="cost" data-cid="up:${u.id}">${mx ? '最大' : cs(c)}</span></button></li>`;
    }
    h += '</ul>';
    if (tab === 'core') h += `<button class="small" data-act="reset">データを消す</button>`;
  } else {
    h += '<div class="slots">';
    for (let k = 0; k < 4; k++){
      if (k >= save.slots) h += `<div class="slot lockd">未解放</div>`;
      else { const m = MODS.find(x => x.id === save.equip[k]); h += m ? `<div class="slot">${m.name}</div>` : `<div class="slot empty">空き</div>`; }
    }
    h += '</div>';
    if (save.slots < 4){ const c = slotCost(); h += `<button class="buy" style="margin-top:10px" data-act="slot" data-cid="slot" ${save.coins < c ? 'disabled' : ''}>装備枠を増やす　${cs(c)}</button>`; }
    h += '<ul class="list" style="margin-top:14px">';
    for (const m of MODS){
      const l = ML(m.id), on = save.equip.includes(m.id), mx = l >= m.max, c = modCost(m), can = !mx && save.coins >= c, full = !on && save.equip.length >= save.slots;
      h += `<li><div class="item ${l ? '' : 'locked'}">
        <span class="name">${m.name}${l ? `<span class="lv">Lv ${l}</span>` : ''}</span>
        <span class="val">${l ? (mx ? m.v(l) + '（最大）' : `${m.v(l)} → ${m.v(l + 1)}`) : m.v(1)}</span>
        <span class="note">${m.note}</span>
        <span class="acts">
          ${mx ? '<span class="cost">最大</span>' : `<button class="cost ${can ? 'can' : ''}" data-mod="${m.id}" data-cid="mod:${m.id}" aria-disabled="${!can}">${l ? '' : '解放 '}${cs(c)}</button>`}
          ${l ? `<button class="eq ${on ? 'on' : ''}" data-eq="${m.id}" ${full ? 'disabled' : ''}>${on ? '装備中' : full ? '枠がいっぱい' : '装備する'}</button>` : ''}
        </span></div></li>`;
    }
    h += '</ul>';
  }
  return h;
}
function renderSheet(keepScroll){
  const sc = keepScroll ? sheetBody.scrollTop : 0;
  renderTabs(); sheetBody.innerHTML = sheetHtml(); sheetBody.scrollTop = sc;
}
function refreshSheet(){
  if (sheet.hidden) return;
  sheetBody.querySelectorAll('[data-cid]').forEach(e => {
    const [kind, id] = e.dataset.cid.split(':'); let c;
    if (kind === 'up') c = upCost(UPG.find(u => u.id === id)); else if (kind === 'mod') c = modCost(MODS.find(m => m.id === id)); else c = slotCost();
    const can = save.coins >= c;
    if (kind === 'slot'){ e.disabled = !can; return; }
    const target = kind === 'up' ? e.closest('.item') : e;
    target.classList.toggle('can', can); target.setAttribute('aria-disabled', String(!can));
  });
  tabsEl.querySelectorAll('.tab').forEach(t => { const k = t.dataset.tab, want = k !== tab && anyAffordable(k); const has = !!t.querySelector('.dot'); if (want && !has) t.insertAdjacentHTML('beforeend', '<span class="dot"></span>'); else if (!want && has) t.querySelector('.dot').remove(); });
}
function openSheet(){ sheet.hidden = false; renderSheet(false); stopHold(); }
function closeSheet(){ sheet.hidden = true; }
el('shopBtn').addEventListener('click', () => { initAudio(); sheet.hidden ? openSheet() : closeSheet(); });
el('closeSheet').addEventListener('click', closeSheet);
sheet.addEventListener('click', e => {
  initAudio();
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  const buy = (c, f) => { if (save.coins >= c){ save.coins -= c; f(); persist(); sfxBuy(); renderSheet(true); } };
  if (d.tab){ tab = d.tab; renderSheet(false); return; }
  if (d.up){ const u = UPG.find(x => x.id === d.up); if (L(u.id) < u.max) buy(upCost(u), () => save.lv[u.id] = L(u.id) + 1); return; }
  if (d.mod){ const m = MODS.find(x => x.id === d.mod); if (ML(m.id) < m.max) buy(modCost(m), () => { const was = ML(m.id); save.mods[m.id] = was + 1; if (!was && save.equip.length < save.slots) save.equip.push(m.id); }); return; }
  if (d.eq){ const i = save.equip.indexOf(d.eq); if (i >= 0) save.equip.splice(i, 1); else if (save.equip.length < save.slots) save.equip.push(d.eq); persist(); renderSheet(true); return; }
  if (d.act === 'slot'){ if (save.slots < 4) buy(slotCost(), () => save.slots++); return; }
  if (d.act === 'reset'){
    if (t.classList.contains('armed')){
      save = JSON.parse(JSON.stringify(DEFAULT)); persist(); boss = null; tab = 'idle';
      updateStageLabel(); updateProgLabel(); syncMute(); buildGrid(); closeSheet(); showTitle();
    } else { t.classList.add('armed'); t.textContent = 'もう一度押すと全データが消えます'; }
  }
});

/* ---- 全画面 ---- */
let welcomeGain = 0;
function showTitle(){
  state = 'title'; overlay.hidden = false;
  overlay.innerHTML = `<div class="panel center">
    <h1 class="big-title display">連鎖<span>破壊</span></h1>
    <p>ドローンが勝手にブロックを壊し続ける。タップすれば一気に加速。飛び散った破片がまわりを壊し、そこからまた破片が飛ぶ。</p>
    <p>目を離していても壊れ続ける。戻ってきたら、稼いだコインで放置と操作の両方を強くしよう。</p>
    <button class="go" data-act="start">始める</button></div>`;
}
function showWelcome(gain, secs){
  state = 'welcome'; welcomeGain = gain; overlay.hidden = false;
  const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60);
  overlay.innerHTML = `<div class="panel center">
    <h1 class="display">おかえり！</h1>
    <p>留守の${h ? h + '時間' : ''}${m}分のあいだ、ドローンが壊し続けていた。</p>
    <div class="welcome-num display">+${fmt(gain)}</div>
    <button class="go" data-act="claim">受け取る</button></div>`;
}
function showEnding(){
  state = 'ending'; overlay.hidden = false; closeSheet();
  overlay.innerHTML = `<div class="panel center"><h1 class="display">宇宙、粉砕。</h1>
    <p>木箱から始めて、銀河の塊まで砕いた。最高コンボは${save.best.toLocaleString('ja-JP')}。</p>
    <p>ここから先は、数字をどこまで伸ばせるかの勝負。ボスは何度でも現れる。</p>
    <button class="go" data-act="resume">壊し続ける</button></div>`;
}
overlay.addEventListener('click', e => {
  initAudio(); const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.act === 'start'){ save.started = true; persist(); overlay.hidden = true; state = 'play'; }
  else if (t.dataset.act === 'claim'){ save.coins += welcomeGain; welcomeGain = 0; persist(); sfxGold(); overlay.hidden = true; state = 'play'; }
  else if (t.dataset.act === 'resume'){ overlay.hidden = true; state = 'play'; }
});

/* ---- 放置・オフライン ---- */
function offline(secsRaw){
  const secs = Math.min(8 * 3600, secsRaw);
  if (secs > 60 && save.idleRate > 0){ showWelcome(save.idleRate * secs * .5, secs); return true; }
  return false;
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ persist(); hiddenAt = Date.now(); stopHold(); }
  else { last = performance.now(); if (hiddenAt && state === 'play') offline((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
});

/* ---- ループ ---- */
let last = performance.now(), saveT = 0, refT = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  if (freeze > 0) freeze -= dt; else { step(dt); updateFx(dt); }
  tickT += dt;
  if (tickT >= 1){
    const rate = earnedTick / tickT; earnedTick = 0; tickT = 0;
    dispRate = dispRate ? dispRate * .7 + rate * .3 : rate;
    if (state === 'play' && lastTap > 8) save.idleRate = save.idleRate ? save.idleRate * .9 + rate * .1 : rate;
  }
  render(); hud(dt);
  refT += dt; if (refT > .4){ refT = 0; refreshSheet(); shopDot.hidden = !(sheet.hidden && TABS.some(([k]) => anyAffordable(k))); }
  saveT += dt; if (saveT > 5){ saveT = 0; persist(); }
  requestAnimationFrame(frame);
}
load();
new ResizeObserver(() => resize()).observe(stageEl);
resize(); updateStageLabel(); updateProgLabel(); syncMute();
if (!save.started) showTitle();
else { state = 'play'; if (save.t) offline((Date.now() - save.t) / 1000); }
requestAnimationFrame(frame);

})();
</script>
